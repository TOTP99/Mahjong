const suitOrder = ['万', '条', '筒', '字'];
function tileCompare(a, b) {
    const sa = tileSuit(a), sb = tileSuit(b);
    if (sa !== sb) return suitOrder.indexOf(sa) - suitOrder.indexOf(sb);
    return tileRank(a) - tileRank(b);
}

/** 废牌区（牌池）专用排序：筒→条→万，各花色内部从9到1；字牌按 中发白东西南北 */
const poolSuitOrder = ['筒', '条', '万', '字'];
const poolHonorOrder = ['中', '发', '白', '东', '西', '南', '北'];
function poolTileCompare(a, b) {
    const sa = tileSuit(a), sb = tileSuit(b);
    if (sa !== sb) return poolSuitOrder.indexOf(sa) - poolSuitOrder.indexOf(sb);
    if (sa === '字') {
        const ia = poolHonorOrder.indexOf(honors[tileRank(a) - 1]);
        const ib = poolHonorOrder.indexOf(honors[tileRank(b) - 1]);
        return ia - ib;
    }
    return tileRank(b) - tileRank(a); // 数牌从9到1
}

// 流局：查一下四家听牌情况再宣布
function declareDraw() {
    gameOver = true;
    const tenpaiPlayers = turnOrder.filter(p => isTenpai(p));
    const notTenpai = turnOrder.filter(p => !isTenpai(p));
    let msg = '牌墙已尽，流局。';
    if (tenpaiPlayers.length === 4) {
        msg += '四家都听牌。';
    } else if (tenpaiPlayers.length === 0) {
        msg += '没有人听牌。';
    } else {
        msg += '听牌：' + tenpaiPlayers.map(nameOf).join('、') + '；不听：' + notTenpai.map(nameOf).join('、');
    }
    logFlow(msg + ' 点✅开下一局');
    speak('流局');
    learnFromDraw(tenpaiPlayers);
    render();
    // 骰子按钮已移除：流局后用提示条开下一局
    pendingClaim = { mode: 'nextGame' };
    showIndicator('🔔 流局', true);
}


// 语音播报排队：连续触发的播报（比如摸/打这张牌的名字，紧接着又要念吃碰杠胡）
// 不能互相打断，必须一句话说完再说下一句，所以用队列串行播放，而不是 cancel() 抢占
let speechQueue = [];
let speechSpeaking = false;
const SPEECH_QUEUE_MAX = 2; // 等待中最多囤2句，避免动作太密时语音越播越滞后于画面

function speak(text) {
    try {
        if (!window.speechSynthesis) return;
        const clean = text.replace(/🐲|🐯|🦁|🐈|👑/g, '');
        speechQueue.push(clean);
        // 队列积压太多时丢弃最旧的等待项，只保留最近的，让语音尽量追上当前局面
        while (speechQueue.length > SPEECH_QUEUE_MAX) speechQueue.shift();
        processSpeechQueue();
    } catch (e) { /* 语音不可用则静默 */ }
}

function processSpeechQueue() {
    if (speechSpeaking || speechQueue.length === 0) return;
    speechSpeaking = true;
    const clean = speechQueue.shift();
    const utter = new SpeechSynthesisUtterance(clean);
    utter.lang = 'zh-CN';
    utter.rate = 1.1;
    utter.onend = utter.onerror = () => {
        speechSpeaking = false;
        processSpeechQueue();
    };
    speechSynthesis.speak(utter);
}

// 新开一局时清空上一局可能积压的播报，避免旧播报堆到新局里
function resetSpeechQueue() {
    speechQueue = [];
    speechSpeaking = false;
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
}

// 语音播报里指称某家：自己念“你”，其余念座位名（speak 会自动去掉表情符号）
function voiceName(p) { return p === 'bottom' ? '你' : nameOf(p); }


// 流程提示：只显示文字（在“你”的牌下方），不语音
function logFlow(msg) {
    const el = $('flow-log');
    if (el) el.innerText = msg;
}

// 检查某手牌是否凑齐了东南西北(风)或中发白(箭)各一张
function checkWindDragonPattern(hand) {
    const winds = ['1字', '2字', '3字', '4字'];
    const dragons = ['5字', '6字', '7字'];
    if (winds.every(t => hand.includes(t))) return 'winds';
    if (dragons.every(t => hand.includes(t))) return 'dragons';
    return null;
}

// 亮牌：把东南西北(4张)或中发白(3张)从暗牌里移出，变成一组“亮牌”明组，占一个面子位
// 中发白正好3张，跟碰/吃一样不用补牌；东南西北4张，跟杠一样需要补一张牌才能凑够面子位的牌数
// 算幺九+刻子，但不算开门。返回false代表补牌时牌墙已尽、流局已处理，调用方不要再继续往下走
function applyReveal(player, kind) {
    windDragonBonus[player] = true;
    const tiles = kind === 'winds' ? ['1字', '2字', '3字', '4字'] : ['5字', '6字', '7字'];
    tiles.forEach(t => { hands[player].splice(hands[player].indexOf(t), 1); });
    exposedMelds[player].push({ type: kind, tiles: [...tiles] });
    logFlow(nameOf(player) + (kind === 'winds' ? ' 亮出东南西北' : ' 亮出中发白') + '（算幺九+刻子，不算开门）');
    speak('亮牌');
    if (kind === 'dragons') { render(); return true; } // 3张，不用补牌
    if (deck.length <= DEAD_WALL) { declareDraw(); return false; }
    const drawn = deck.pop();
    hands[player].push(drawn);
    hands[player].sort(tileCompare);
    lastDrawnTile[player] = drawn;
    lastDrawWasFinal[player] = deck.length === DEAD_WALL;
    if (player === 'bottom') { lastDrawnIndex = hands.bottom.lastIndexOf(drawn); selectedIndex = null; }
    render();
    return true;
}

let pendingReveal = null; // 'winds' | 'dragons'，等待你在弹窗里选择

function offerReveal(kind) {
    pendingReveal = kind;
    $('reveal-title').innerText =
        (kind === 'winds' ? '手里凑齐了东南西北' : '手里凑齐了中发白') + '，要亮牌吗？（算幺九+刻子，但不算开门；亮牌后补一张牌）';
    $('reveal-modal').classList.add('show');
}

function confirmReveal(reveal) {
    const kind = pendingReveal;
    pendingReveal = null;
    $('reveal-modal').classList.remove('show');
    if (reveal) {
        if (!applyReveal('bottom', kind)) return; // 补牌时牌墙已尽，流局已处理
    }
    continueAfterFirstTurnCheck('bottom');
}

// 摸牌之后的自摸判断与后续流程（首次摸牌的亮牌选择处理完之后也会走到这里）
function continueAfterFirstTurnCheck(player) {
    if (gameOver) return;
    if (checkHu(hands[player], exposedMelds[player], player)) {
        if (player === 'bottom') {
            offerHu({ mode: 'selfdraw', concealed: hands.bottom });
        } else {
            gameOver = true;
            winner = player;
            const winTile = lastDrawnTile[player];
            const before = [...hands[player]];
            before.splice(before.indexOf(winTile), 1);
            const bonus = scoreWinningHand(before, winTile, exposedMelds[player], true, lastDrawWasFinal[player]);
            const result = settleScore(player, 'selfdraw', null, bonus);
            logFlow(nameOf(player) + ' 自摸胡牌！' + result.detail);
            speak('胡了，自摸');
            learnFromWin(player, null);
            showResultModal(player, 'selfdraw', null, bonus, result, winTile);
        }
        return;
    }

    if (player === 'bottom') {
        // 检查暗杠/加杠机会，可选提示（不挡出牌）
        offerSelfGangIfAny();
        logFlow('轮到你，请点击一张牌出牌');
    } else {
        setTimeout(() => aiDiscard(player), 700);
    }
}

// 检查自己回合是否可暗杠或加杠，弹出 🔔杠 ✅❎（可选，点❎或不理会都能继续出牌）
function offerSelfGangIfAny() {
    if (gameOver || pendingClaim) return;
    // 加杠：已碰过的牌，手里又有第4张
    for (const meld of exposedMelds.bottom) {
        if (meld.type === 'peng' && hands.bottom.includes(meld.tiles[0])) {
            pendingClaim = { mode: 'selfGang', kind: 'jia', tile: meld.tiles[0] };
            showIndicator('🔔 杠', true);
            logFlow('可以加杠 ' + tileGlyph(meld.tiles[0]) + '，点✅杠 / 点❎或直接出牌');
            return;
        }
    }
    // 暗杠：手里4张一样（穷胡规则：不能手把一，最多留3组面子在外，第4组必须留在手里）
    if (exposedMelds.bottom.length < 3) {
        const counts = {};
        hands.bottom.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
        for (const t in counts) {
            if (counts[t] >= 4) {
                pendingClaim = { mode: 'selfGang', kind: 'an', tile: t };
                showIndicator('🔔 杠', true);
                logFlow('可以暗杠 ' + tileGlyph(t) + '，点✅杠 / 点❎或直接出牌');
                return;
            }
        }
    }
}

function executeSelfGang() {
    if (!pendingClaim || pendingClaim.mode !== 'selfGang') return;
    const { kind, tile } = pendingClaim;
    pendingClaim = null;
    hideIndicator();
    if (kind === 'jia') {
        // 抢杠检查
        const robber = findRonPriority('bottom', tile);
        if (robber && robber !== 'bottom') {
            const idx = hands.bottom.indexOf(tile);
            if (idx > -1) hands.bottom.splice(idx, 1);
            hands[robber].push(tile);
            gameOver = true;
            winner = robber;
            const before = [...hands[robber]];
            before.splice(before.indexOf(tile), 1);
            const bonus = scoreWinningHand(before, tile, exposedMelds[robber], false, false);
            const result = settleScore(robber, 'dianpao', 'bottom', bonus);
            logFlow(nameOf(robber) + ' 抢杠胡了你加杠的 ' + tileGlyph(tile) + '！' + result.detail);
            speak('胡了，' + voiceName('bottom') + '点炮');
            learnFromWin(robber, 'bottom');
            render();
            showResultModal(robber, 'dianpao', 'bottom', bonus, result, tile);
            return;
        }
        const idx = hands.bottom.indexOf(tile);
        if (idx > -1) hands.bottom.splice(idx, 1);
        for (const meld of exposedMelds.bottom) {
            if (meld.type === 'peng' && meld.tiles[0] === tile) {
                meld.type = 'gang';
                meld.tiles.push(tile);
                break;
            }
        }
        logFlow('你加杠了 ' + tileGlyph(tile) + '，补牌中...');
        speak('杠' + tileName(tile));
        render();
        drawReplacementAndContinue();
        return;
    }
    // 暗杠
    if (exposedMelds.bottom.length >= 3) { logFlow('穷胡规则：不能手把一，最后一组必须留在手里'); return; }
    for (let i = 0; i < 4; i++) {
        const idx = hands.bottom.indexOf(tile);
        if (idx > -1) hands.bottom.splice(idx, 1);
    }
    exposedMelds.bottom.push({ type: 'gang', tiles: [tile, tile, tile, tile], concealed: true });
    logFlow('你暗杠了 ' + tileGlyph(tile) + '，补牌中...');
    speak('杠' + tileName(tile));
    render();
    drawReplacementAndContinue();
}

function nextTurn() {
    if (gameOver) return;
    if (deck.length <= DEAD_WALL) { declareDraw(); return; }
    const player = turnOrder[currentIndex];
    const drawn = deck.pop();
    hands[player].push(drawn);
    hands[player].sort(tileCompare);
    lastDrawnTile[player] = drawn;
    lastDrawWasFinal[player] = deck.length === DEAD_WALL;
    if (player === 'bottom') { lastDrawnIndex = hands.bottom.lastIndexOf(drawn); selectedIndex = null; }
    render();
    highlightActive(player);

    if (firstTurnPending[player]) {
        firstTurnPending[player] = false;
        const kind = checkWindDragonPattern(hands[player]);
        if (kind) {
            if (player === 'bottom') {
                offerReveal(kind); // 等你在弹窗里选，选完会调用continueAfterFirstTurnCheck接着走
                return;
            }
            // AI优先自动选择亮牌
            if (!applyReveal(player, kind)) return; // 补牌时牌墙已尽，流局已处理
        }
    }

    continueAfterFirstTurnCheck(player);
}

function canPeng(hand, tile) {
    return hand.filter(t => t === tile).length >= 2;
}

function canGang(hand, tile) {
    return hand.filter(t => t === tile).length >= 3;
}

// 返回可吃的组合（手牌中的两张），找不到返回 null
// 返回所有可行的吃法组合(可能不止一种，比如摸到5万，手里有3万4万又有6万7万)
function findChiCombos(hand, tile) {
    const suit = tileSuit(tile);
    if (suit === '字') return []; // 字牌没有顺子，不能吃
    const rank = tileRank(tile);
    const combos = [[rank - 2, rank - 1], [rank - 1, rank + 1], [rank + 1, rank + 2]];
    const found = [];
    for (const [a, b] of combos) {
        if (a < 1 || b > 9) continue;
        const ta = a + suit, tb = b + suit;
        if (hand.includes(ta) && hand.includes(tb)) found.push([ta, tb]);
    }
    return found;
}

// 改一家，其余按点炮/自摸关系自动联动
function onSettlementPayoutEdit(input) {
    if (!lastSettlement) return;
    const p = input.dataset.player;
    if (input.value.trim() === '' || input.value.trim() === '-') return; // 还在输入中（比如刚打了个负号），先不处理
    let v = parseInt(input.value, 10);
    if (isNaN(v)) return;
    applySettlementPayoutValue(p, v);
}

// ×2 / ÷2 按钮：在当前值基础上直接乘/除，可反复点击
function adjustSettlementPayoutFactor(p, factor) {
    if (!lastSettlement) return;
    const cur = lastSettlement.payouts[p];
    const v = Math.round(cur * factor);
    applySettlementPayoutValue(p, v);
}

// 改一家，其余按点炮/自摸关系自动联动
function applySettlementPayoutValue(p, v) {
    if (!lastSettlement) return;
    const old = lastSettlement.payouts[p];
    if (v === old) return;

    const { mode, winner, payer } = lastSettlement;
    const pay = lastSettlement.payouts;

    if (mode === 'dianpao') {
        // 点炮：只有赢家与点炮者，互为相反数
        if (p === winner) {
            pay[winner] = v;
            if (payer) pay[payer] = -v;
        } else if (p === payer) {
            pay[payer] = v;
            pay[winner] = -v;
        } else {
            // 其余两家本应是 0，强制回 0
            pay[p] = 0;
        }
    } else {
        // 自摸：三家付钱，赢家收总和
        if (p === winner) {
            // 改赢家总分：按原系统付款比例（或均分）把差额摊到三家
            const losers = turnOrder.filter(x => x !== winner);
            const oldWin = old;
            const delta = v - oldWin;
            pay[winner] = v;
            // 按原付款绝对值比例分摊；若原都为 0 则均分
            const weights = losers.map(x => Math.abs(lastSettlement.systemPayouts[x]) || 0);
            const wsum = weights.reduce((a, b) => a + b, 0);
            if (wsum === 0) {
                const each = Math.trunc(delta / losers.length);
                let remain = delta - each * losers.length;
                losers.forEach((x, i) => {
                    pay[x] -= each + (i === 0 ? remain : 0);
                });
            } else {
                let allocated = 0;
                losers.forEach((x, i) => {
                    if (i === losers.length - 1) {
                        pay[x] -= (delta - allocated);
                    } else {
                        const share = Math.round(delta * weights[i] / wsum);
                        pay[x] -= share;
                        allocated += share;
                    }
                });
            }
        } else {
            // 改某一家付款：赢家收入随之增减
            const delta = v - old; // 付款方变多（如 -4→-6，delta=-2）则赢家少 2
            pay[p] = v;
            pay[winner] -= delta;
        }
    }

    renderSettlementView();
    // 保持当前编辑框焦点数值已由 render 刷新
}

function resetSettlementPayouts() {
    if (!lastSettlement) return;

// ---------- 保牌AI：给每张牌算一个“保留等级”，数值越小越优先被打出 ----------
// 0=孤立字牌 1=孤立中张(2,3,7,8) 2=孤立中张(4,5,6) 3=孤立幺九/嵌张
// 4=刻子(三者中最先舍) 5=连张/搭子/三门齐保护 6=对子(最优先保留)
function protectsThreeSuits(hand, tile) {
    const suit = tileSuit(tile);
    if (suit === '字') return false; // 字牌不影响三门齐
    const suitsPresent = new Set(hand.filter(t => tileSuit(t) !== '字').map(tileSuit));
    if (suitsPresent.size < 3) return false; // 已经不是三门齐了，没必要为了保它牺牲效率
    return hand.filter(t => tileSuit(t) === suit).length === 1; // 这门僅剩的一张，打了就断这门了
}

// ---------- 记牌：统计场面上能看到的牌，判断某个搭子还有没有指望 ----------
// 只数看得见的：弃牌堆 + 各家已经亮出的碰/吃/明杠/亮牌（暗杠盖着，不算"看得见"）
function tileSeenCount(tile) {
    let count = discardPile.filter(d => d.tile === tile).length;
    for (const p of turnOrder) {
        for (const m of exposedMelds[p]) {
            if (m.type === 'gang' && m.concealed) continue; // 暗杠看不见，不计入
            count += m.tiles.filter(t => t === tile).length;
        }
    }
    return count;
}

function isTileDead(tile) {
    return tileSeenCount(tile) >= 4; // 4张都已经在看得见的地方了，这张没指望了
}

// ---------- AI：精确结构向听（DFS 拆面子 + 剩余搭子评估） / 吃碰评估 ----------
/** 牌面 → 0..33：万0-8 条9-17 筒18-26 字27-33 */
function tileToIndex(t) {
    const s = tileSuit(t), r = tileRank(t);
    if (s === '万') return r - 1;
    if (s === '条') return 9 + r - 1;
    if (s === '筒') return 18 + r - 1;
    return 26 + r; // 1字..7字 → 27..33
}

function buildCount34(concealed) {
    const c = new Array(34).fill(0);
    for (const t of concealed) {
        const i = tileToIndex(t);
        if (i >= 0 && i < 34) c[i]++;
    }
    return c;
}

/** 在已去掉完整面子、并已取走将牌（或确定无将）的剩余里，贪心数搭子 */
function countTaatsu34(cnt) {
    const c = cnt.slice();
    let taatsu = 0;
    // 数牌：连张优先，再嵌张
    for (let base = 0; base < 27; base += 9) {
        for (let i = 0; i < 9; i++) {
            const p = base + i;
            while (c[p] > 0) {
                if (i <= 7 && c[p + 1] > 0) {
                    c[p]--; c[p + 1]--;
                    taatsu++;
                } else if (i <= 6 && c[p + 2] > 0) {
                    c[p]--; c[p + 2]--;
                    taatsu++;
                } else {
                    c[p]--; // 孤张
                }
            }
        }
    }
    // 字牌无顺子搭子；对子已在上层处理
    return taatsu;
}

/**
 * 已知已拆出 melds 个完整面子后，对剩余牌枚举将牌选择，计算向听。
 * 公式：还缺 m 个面子时，向听 ≈ 2m - (有将?1:0) - 可用搭子数（有上限）。
 */
function shantenFromRest(cnt, melds, needMelds) {
    let best = 20;
    const mNeed = Math.max(0, needMelds - melds);

    const evalWith = (pair, taatsu) => {
        let t = taatsu;
        // 面子+搭子(+将) 的块数不能超过 needMelds+1
        const maxT = pair ? mNeed : mNeed; // 搭子最多补 mNeed 个面子
        // 无将时多出的对子型搭子已计入 taatsu
        if (t > maxT) t = maxT;
        if (t < 0) t = 0;
        // 完成形：melds==needMelds 且 pair→ -1；听牌 → 0
        return 2 * mNeed - (pair ? 1 : 0) - t;
    };

    // 不加将
    best = Math.min(best, evalWith(0, countTaatsu34(cnt)));

    // 枚举一种将牌
    for (let i = 0; i < 34; i++) {
        if (cnt[i] >= 2) {
            cnt[i] -= 2;
            best = Math.min(best, evalWith(1, countTaatsu34(cnt)));
            cnt[i] += 2;
        }
    }
    return best;
}

/**
 * 复杂向听：对「拆出完整面子」的所有分支做 DFS，再评估剩余。
 * 只衡量一般形（面子+将），不含穷胡的开门/三门齐/幺九。
 * 返回：-1 已和（结构），0 听牌，1+ 向听数。
 */
function calcComplexShanten(concealed, needMelds) {
    if (needMelds < 0) return 8;
    if (needMelds === 0) {
        // 只剩将：0～1 张或一对
        if (concealed.length === 0) return 1;
        if (concealed.length === 1) return 0;
        if (concealed.length === 2 && concealed[0] === concealed[1]) return -1;
        return Math.max(0, concealed.length - 1);
    }
    const root = buildCount34(concealed);
    let minS = 20;

    function dfs(cnt, from, melds) {
        // 每个节点都可「停止拆面子」并评估
        const s = shantenFromRest(cnt, melds, needMelds);
        if (s < minS) minS = s;
        if (melds >= needMelds || minS < 0) return;

        for (let i = from; i < 34; i++) {
            if (cnt[i] === 0) continue;
            // 刻子
            if (cnt[i] >= 3) {
                cnt[i] -= 3;
                dfs(cnt, i, melds + 1);
                cnt[i] += 3;
            }
            // 顺子（仅数牌，且起点 rank<=7）
            if (i < 27 && (i % 9) <= 6 && cnt[i] > 0 && cnt[i + 1] > 0 && cnt[i + 2] > 0) {
                cnt[i]--; cnt[i + 1]--; cnt[i + 2]--;
                dfs(cnt, i, melds + 1);
                cnt[i]++; cnt[i + 1]++; cnt[i + 2]++;
            }
        }
    }

    dfs(root, 0, 0);
    if (minS > 8) minS = 8;
    return minS;
}

/**
 * AI 用向听入口：按副露数决定手牌还需几个面子。
 * -1 结构已和；0 结构听牌；正数越大越远。
 */
function estimateShanten(concealed, exposed) {
    const needMelds = 4 - (exposed ? exposed.length : 0);
    if (needMelds < 0) return 8;
    // 张数与目标差太大时先快速裁剪，避免无意义 DFS
    const n = concealed.length;
    const winLen = needMelds * 3 + 2;
    const tenpaiLen = needMelds * 3 + 1;
    if (n === 0) return needMelds * 2 + 1;
    if (n > winLen + 3) return Math.min(8, n - tenpaiLen);
    return calcComplexShanten(concealed, needMelds);
}

// ========== 性能基准（控制台：benchmarkMahjongAI()）==========
/** 统计一组耗时样本：min/max/avg/median/p95/opsPerSec */
function _benchStats(samplesMs, totalMs, ops) {
    const a = samplesMs.slice().sort((x, y) => x - y);
    const n = a.length;
    const sum = a.reduce((s, v) => s + v, 0);
    const mid = n % 2 ? a[(n - 1) >> 1] : (a[n / 2 - 1] + a[n / 2]) / 2;
    const p95 = a[Math.min(n - 1, Math.ceil(n * 0.95) - 1)];
    return {
        runs: n,
        totalMs: Math.round(totalMs * 1000) / 1000,
        minMs: Math.round(a[0] * 1000) / 1000,
        maxMs: Math.round(a[n - 1] * 1000) / 1000,
        avgMs: Math.round((sum / n) * 1000) / 1000,
        medianMs: Math.round(mid * 1000) / 1000,
        p95Ms: Math.round(p95 * 1000) / 1000,
        opsPerSec: totalMs > 0 ? Math.round((ops / totalMs) * 1000) : 0
    };
}

function _benchNow() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
}

/** 固定测试牌型（覆盖完成形 / 听牌 / 一向听 / 散牌 / 带副露） */
function _benchHandFixtures() {

        {
            name: 'complete-14',
            concealed: ['1万','2万','3万','4万','5万','6万','7万','8万','9万','1条','1条','1条','2筒','2筒'],

}

/**
 * 运行性能基准。
 * @param {object} [opt]
 * @param {number} [opt.iterations=200] 每个用例重复次数
 * @param {boolean} [opt.includeAiDiscard=true] 是否测 AI 舍牌
 * @param {boolean} [opt.includeCheckHu=true] 是否测 checkHu
 * @param {boolean} [opt.log=true] 是否 console.table / logFlow
 * @returns {object} 详细报告
 */
function benchmarkMahjongAI(opt) {
    const iterations = (opt && opt.iterations) || 200;
    const includeAiDiscard = !opt || opt.includeAiDiscard !== false;
    const includeCheckHu = !opt || opt.includeCheckHu !== false;
    const doLog = !opt || opt.log !== false;
    const fixtures = _benchHandFixtures();
    const report = {
        meta: {
            iterations,
            ts: new Date().toISOString(),
            userAgent: (typeof navigator !== 'undefined' && navigator.userAgent) ? navigator.userAgent : 'node',
            note: '结构向听 DFS；不含渲染。opsPerSec 按单次函数调用计。'
        },
        shanten: {},
        checkHu: null,
        aiDiscard: null
    };

    // —— 1) estimateShanten / calcComplexShanten ——
    for (const fx of fixtures) {
        const samples = [];
        const t0 = _benchNow();
        let last = null;
        for (let i = 0; i < iterations; i++) {
            const s0 = _benchNow();
            last = estimateShanten(fx.concealed, fx.exposed);
            samples.push(_benchNow() - s0);
        }
        const total = _benchNow() - t0;
        report.shanten[fx.name] = {
            result: last,
            needMelds: 4 - fx.exposed.length,
            tileCount: fx.concealed.length,
            timing: _benchStats(samples, total, iterations)
        };
    }

    // —— 2) checkHu（听牌形补一张）——
    if (includeCheckHu) {
        const hand = ['1万','2万','3万','4万','5万','6万','7万','8万','9万','1条','1条','1条','2筒'];
        const winTile = '2筒';
        const samples = [];
        const t0 = _benchNow();
        let ok = false;
        for (let i = 0; i < iterations; i++) {
            const s0 = _benchNow();
            ok = checkHu([...hand, winTile], [], null);
            samples.push(_benchNow() - s0);
        }
        report.checkHu = {
            result: ok,
            timing: _benchStats(samples, _benchNow() - t0, iterations)
        };
    }

    // —— 3) chooseAiDiscardTile（需临时挂手牌环境）——
    if (includeAiDiscard && typeof chooseAiDiscardTile === 'function') {
        const savedHands = hands;
        const savedExposed = exposedMelds;
        const savedWait = aiWaitTiles;
        try {
            const discSamples = {};
            for (const fx of fixtures) {
                if (fx.concealed.length < 2) continue;
                hands = {
                    top: fx.concealed.slice(),
                    left: fx.concealed.slice(),
                    right: fx.concealed.slice(),
                    bottom: fx.concealed.slice()
                };
                exposedMelds = {
                    top: fx.exposed.slice(),
                    left: fx.exposed.slice(),
                    right: fx.exposed.slice(),
                    bottom: fx.exposed.slice()
                };
                aiWaitTiles = { top: [], left: [], right: [] };
                const samples = [];
                const t0 = _benchNow();
                let pick = null;
                const n = Math.min(iterations, 80); // 舍牌含多次向听，次数略降
                for (let i = 0; i < n; i++) {
                    const s0 = _benchNow();
                    pick = chooseAiDiscardTile(fx.concealed.slice(), 'top');
                    samples.push(_benchNow() - s0);
                }
                discSamples[fx.name] = {
                    picked: pick,
                    timing: _benchStats(samples, _benchNow() - t0, n)
                };
            }
            report.aiDiscard = discSamples;
        } finally {
            hands = savedHands;
            exposedMelds = savedExposed;
            aiWaitTiles = savedWait;
        }
    }

    if (doLog) {
        console.log('[Mahjong AI Benchmark]', report.meta);
        console.log('--- estimateShanten ---');
        const shanRows = Object.keys(report.shanten).map(k => {
            const r = report.shanten[k];
            return {
                case: k,
                result: r.result,
                tiles: r.tileCount,
                avgMs: r.timing.avgMs,
                medianMs: r.timing.medianMs,
                p95Ms: r.timing.p95Ms,
                opsPerSec: r.timing.opsPerSec
            };
        });
        console.table(shanRows);
        if (report.checkHu) {
            console.log('--- checkHu ---', report.checkHu);
        }
        if (report.aiDiscard) {
            console.log('--- chooseAiDiscardTile ---');
            const rows = Object.keys(report.aiDiscard).map(k => {
                const r = report.aiDiscard[k];
                return {
                    case: k,
                    picked: r.picked,
                    avgMs: r.timing.avgMs,
                    medianMs: r.timing.medianMs,
                    p95Ms: r.timing.p95Ms,
                    opsPerSec: r.timing.opsPerSec
                };
            });
            console.table(rows);
        }
        try {
            const avgShan = shanRows.reduce((s, r) => s + r.avgMs, 0) / (shanRows.length || 1);
            logFlow('基准：向听均 ' + avgShan.toFixed(3) + 'ms；控制台看 benchmarkMahjongAI 详情');
        } catch (e) { /* ignore */ }
    }
    return report;
}

// 暴露到全局，便于手机远程调试 / 桌面控制台
try { window.benchmarkMahjongAI = benchmarkMahjongAI; } catch (e) { /* non-browser */ }

/** 复制手牌并移除若干张（按内容） */
function removeTilesFromHand(hand, tilesToRemove) {
    const next = hand.slice();
    for (const t of tilesToRemove) {
        const i = next.indexOf(t);
        if (i >= 0) next.splice(i, 1);
    }
    return next;
}

/** 三门齐相关：吃/碰后是否仍覆盖三门（或至少不比现在更差） */
function suitDiversity(hand, exposed) {
    const suits = new Set();
    for (const t of hand) {
        if (tileSuit(t) !== '字') suits.add(tileSuit(t));
    }
    for (const m of (exposed || [])) {
        for (const t of m.tiles) {
            if (tileSuit(t) !== '字') suits.add(tileSuit(t));
        }
    }
    return suits.size;
}

/** 评估一种吃法：向听下降优先，其次三门齐，再次不拆对子 */
function scoreChiCombo(hand, tile, combo, exposed, player) {
    const style = aiPersonality[player] || 'shrewd';
    const before = estimateShanten(hand, exposed);
    const handAfter = removeTilesFromHand(hand, combo);
    const expAfter = exposed.concat([{ type: 'chi', tiles: [...combo, tile].sort(tileCompare) }]);
    const after = estimateShanten(handAfter, expAfter);
    let score = (before - after) * 10; // 向听改善越大越好
    // 未开门时，吃能开门有额外价值
    if (!isKaimen(exposed)) score += 4;
    // 三门齐
    const divBefore = suitDiversity(hand, exposed);
    const divAfter = suitDiversity(handAfter, expAfter);
    score += (divAfter - divBefore) * 3;
    if (divAfter >= 3) score += 2;
    // 尽量不拆对子：combo 里若拆了对子则扣分
    for (const t of combo) {
        if (hand.filter(x => x === t).length >= 2) score -= 2;
    }
    // 性格：保守要求至少不升高向听；激进可略接受持平
    if (style === 'conservative' && after > before) score -= 20;
    if (style === 'shrewd' && after > before + 1) score -= 20;
    if (style === 'aggressive' && after > before + 1) score -= 12;
    return score;
}

/** 是否应该吃：有正收益（或未开门且不太亏）。学习偏好：这个性格最近战绩好就放宽门槛，战绩差就收紧 */
function shouldAiChi(player, tile, combo) {
    if (isTenpai(player)) return false;
    const exposed = exposedMelds[player];
    if (exposed.length >= 3) return false;
    const score = scoreChiCombo(hands[player], tile, combo, exposed, player);
    const style = aiPersonality[player] || 'shrewd';
    const conf = aiLearn.confidence[style] || 0;
    const open = isKaimen(exposed);
    const baseThreshold = open ? 4 : 2; // 开门：要有明显收益；未开门：略宽松
    return score >= baseThreshold - conf * 0.6;
}

function tileKeepTier(hand, tile) {
    const suit = tileSuit(tile);
    const rank = tileRank(tile);
    const sameCount = hand.filter(t => t === tile).length;
    let tier;

    if (sameCount >= 3) tier = 4; // 刻子
    else if (sameCount === 2) tier = 6; // 对子：不要轻易拆
    else if (suit === '字') tier = 0; // 孤立字牌（字牌没有搭子概念，出现一张就是孤立的）
    else {
        // 同花色±1/±2内是否还有别的牌，用来判断是不是“完全孤立”
        let hasNear = false;
        for (let d = 1; d <= 2; d++) {
            if (hand.includes((rank - d) + suit) || hand.includes((rank + d) + suit)) { hasNear = true; break; }
        }
        const inRun = hand.includes((rank - 1) + suit) || hand.includes((rank + 1) + suit);
        if (!hasNear) {
            tier = (rank === 1 || rank === 9) ? 3 : ([4, 5, 6].includes(rank) ? 2 : 1);
        } else if (inRun) {
            tier = 5; // 连张/搭子（如45、56、67）
        } else {
            // 嵌张（如4_6空档等5）：记牌检查缺的那张是不是已经死了，死了就不用留着盼了
            let deadWait = false;
            if (hand.includes((rank - 2) + suit) && isTileDead((rank - 1) + suit)) deadWait = true;
            if (hand.includes((rank + 2) + suit) && isTileDead((rank + 1) + suit)) deadWait = true;
            tier = deadWait ? 1 : 3;
        }
    }

    // 三门齐保护：这是本门(万/条/筒)僅剩的一张，且三门都还在，打了就彻底断这门了 —— 提高保留优先级
    if (tier < 5 && protectsThreeSuits(hand, tile)) tier = 5;
    return tier;
}

// 三家AI性格：北(上家)保守 / 南(下家)激进 / 西(对家)精明
const aiPersonality = { left: 'conservative', right: 'aggressive', top: 'shrewd' };

// 检查某玩家打出这张牌，是否会点炮给别的玩家（用于AI出牌时的危险牌回避）
function isTileDangerousFor(player, tile) {
    return turnOrder.some(p => p !== player && checkHu([...hands[p], tile], exposedMelds[p], p));
}

// 在保留等级最低（最优先舍弃）的档位里，优先选不会点炮的牌；避炮的松紧度按性格调整：
// 保守=不惜多跳档也要找安全牌；激进=只在最该舍弃那档找，找不到就照打求效率；精明=折中，最多跳3档
// 牌墙剩余量的紧迫感：越接近荒牌墙，大家都更求稳（多跳几档也要找安全牌）
function wallUrgencyBonus() {
    const remaining = deck.length - DEAD_WALL;
    if (remaining <= 8) return 3;
    if (remaining <= 16) return 1;
    return 0;
}

// 给定手牌+副露，若已是听牌形态，返回可胡的牌列表，否则 []
function getWinningTilesOf(concealed, exposed, player) {
    const neededLen = (4 - exposed.length) * 3 + 2;
    if (concealed.length !== neededLen - 1) return [];
    return allTileTypes().filter(t => checkHu([...concealed, t], exposed, player));
}

function chooseAiDiscardTile(hand, player) {
    const exposed = exposedMelds[player];
    const style = aiPersonality[player] || 'shrewd';

    // —— 已上听 / 摸牌后仍可保听：优先打出后仍听的牌，且尽量不换听口 ——
    const keepTenpai = []; // { tile, wins, overlap, safe }
    for (const t of hand) {
        const remain = hand.slice();
        const ix = remain.indexOf(t);
        if (ix < 0) continue;
        remain.splice(ix, 1);
        const wins = getWinningTilesOf(remain, exposed, player);
        if (!wins.length) continue;
        const prev = aiWaitTiles[player] || [];
        const overlap = prev.length ? wins.filter(w => prev.includes(w)).length : wins.length;
        keepTenpai.push({
            tile: t,
            wins,
            overlap,
            waitCount: wins.length,
            safe: !isTileDangerousFor(player, t)
        });
    }
    if (keepTenpai.length) {
        // 1) 有不点炮的保听优先；2) 尽量与原听口重叠；3) 听张数更多
        const pool = keepTenpai.some(x => x.safe) ? keepTenpai.filter(x => x.safe) : keepTenpai;
        pool.sort((a, b) => {
            if (b.overlap !== a.overlap) return b.overlap - a.overlap;
            if (b.waitCount !== a.waitCount) return b.waitCount - a.waitCount;
            return 0;
        });
        const best = pool[0];
        // 在同档最优里随机，避免死板
        const top = pool.filter(x => x.overlap === best.overlap && x.waitCount === best.waitCount);
        const chosen = top[Math.floor(Math.random() * top.length)];
        aiWaitTiles[player] = chosen.wins;
        return chosen.tile;
    }
    // 已无法保听（或尚未上听）→ 清空听口记忆；按「向听优先 + 安全 + 保留档」舍牌
    aiWaitTiles[player] = [];

    const candidates = [];
    for (const t of hand) {
        const remain = removeTilesFromHand(hand, [t]);
        const shan = estimateShanten(remain, exposed);
        const tier = tileKeepTier(hand, t);
        const safe = !isTileDangerousFor(player, t);
        candidates.push({ tile: t, shan, tier, safe });
    }
    // 向听越小越好；同向听优先安全；再优先扔掉保留档低的牌
    candidates.sort((a, b) => {
        if (a.shan !== b.shan) return a.shan - b.shan;
        if (a.safe !== b.safe) return a.safe ? -1 : 1;
        if (a.tier !== b.tier) return a.tier - b.tier;
        return 0;
    });
    const bestShan = candidates[0].shan;
    // 性格：可在最佳向听的邻近档里找安全牌
    const shanSlack = style === 'conservative' ? 1 : (style === 'aggressive' ? 0 : 1);
    const urgency = wallUrgencyBonus();
    let pool = candidates.filter(c => c.shan <= bestShan + shanSlack);
    // 学习偏好：这个性格最近战绩差（常点炮/常没听牌）就强制找安全牌；战绩好则可以少受"求稳"的约束
    const conf = aiLearn.confidence[style] || 0;
    const cautious = conf <= -1.5;
    const confident = conf >= 1.5;
    if (urgency >= 1 || cautious) {
        const safePool = pool.filter(c => c.safe);
        if (safePool.length) pool = safePool;
    } else if (style !== 'aggressive' && !confident) {
        const safePool = pool.filter(c => c.safe);
        if (safePool.length) pool = safePool;
    }
    // 在池内按 tier 升序（先丢不保的）
    pool.sort((a, b) => a.tier - b.tier || (a.safe === b.safe ? 0 : (a.safe ? -1 : 1)));
    const topTier = pool[0].tier;
    const finalPool = pool.filter(c => c.tier === topTier);
    return finalPool[Math.floor(Math.random() * finalPool.length)].tile;
}

function aiDiscard(player) {
    if (gameOver) return;
    const hand = hands[player];
    if (hand.length === 0) { advanceTurn(); return; } // 防御性检查：正常情况下不会发生
    // 保牌策略：孤立字牌 > 孤立中张(非4/5/6优先) > ... > 对子最后才拆，同等级优先选不点炮的
    const tile = chooseAiDiscardTile(hand, player);
    hand.splice(hand.indexOf(tile), 1);
    discardPile.push({ player, tile });
    render();
    speak(tileName(tile));

    // 多家可以胡的话，按下家方向离出牌人最近的先胡
    const ronPlayer = findRonPriority(player, tile);
    if (ronPlayer === 'bottom') {
        const testHand = [...hands.bottom, tile];
        offerHu({ mode: 'dianpao', tile, fromPlayer: player, concealed: testHand });
        return;
    }
    if (ronPlayer) {
        discardPile.pop();
        hands[ronPlayer].push(tile);
        gameOver = true;
        winner = ronPlayer;
        const before = [...hands[ronPlayer]];
        before.splice(before.indexOf(tile), 1);
        const bonus = scoreWinningHand(before, tile, exposedMelds[ronPlayer], false, false);
        const result = settleScore(ronPlayer, 'dianpao', player, bonus);
        logFlow(nameOf(player) + ' 点炮，' + nameOf(ronPlayer) + ' 胡了！' + result.detail);
        speak('胡了，' + voiceName(player) + '点炮');
        learnFromWin(ronPlayer, player);
        render();
        showResultModal(ronPlayer, 'dianpao', player, bonus, result, tile);
        return;
    }

    checkClaimOrAdvance(player, tile);
}

// 局势判断：这张牌该不该碰（按性格调整松紧度）
// 还没开门：都想尽快满足开门这个硬性条件，优先碰
// 保守：最多碰2组就收手求稳，且必须碰完还留得住将
// 激进：能碰就碰，追求快速开门或飘(碰碰胡)，上限放宽到快满4组前都碰
// 精明：折中，3组以内且碰完留得住将才碰，中发白/风牌额外值得碰
// 手里还有没有连张(同花色相邻的牌)？没有的话说明这手牌天然在往碰碰胡(飘,8倍)方向走
function isGoingForTriplets(hand) {
    for (const t of hand) {
        const suit = tileSuit(t), rank = tileRank(t);
        if (suit === '字') continue;
        if (hand.includes((rank + 1) + suit)) return false;
    }
    return true;
}

function shouldAiPeng(p, tile) {
    if (isTenpai(p)) return false; // 已上听不碰，避免拆听
    const style = aiPersonality[p] || 'shrewd';
    const conf = aiLearn.confidence[style] || 0; // 学习偏好：战绩好更敢碰，战绩差更谨慎
    const exposed = exposedMelds[p];
    const openCount = exposed.length;
    if (openCount >= 3) return false; // 穷胡：不能手把一

    const hand = hands[p];
    const handAfter = removeTilesFromHand(hand, [tile, tile]);
    const expAfter = exposed.concat([{ type: 'peng', tiles: [tile, tile, tile] }]);
    const shanBefore = estimateShanten(hand, exposed);
    const shanAfter = estimateShanten(handAfter, expAfter);

    const otherPairs = [...new Set(hand)].filter(t => t !== tile && hand.filter(x => x === t).length >= 2);
    const keepsJiang = otherPairs.length > 0 || dragonTilesArr.includes(tile);
    const chasingPengPeng = isGoingForTriplets(hand);
    const isHonorValue = dragonTilesArr.includes(tile) || windTilesArr.includes(tile);

    // 副露数量上限（激进可略多，冲碰碰胡再+1；学习战绩很好再多给1个名额，很差则少给1个）
    const cap = (style === 'conservative' ? 2 : (style === 'aggressive' ? 3 : 2))
        + (chasingPengPeng ? 1 : 0)
        + (conf >= 1.5 ? 1 : 0) - (conf <= -1.5 ? 1 : 0);
    if (openCount >= cap && !isHonorValue) return false;

    // 向听约束：默认不能明显变差；学习战绩好可以多容忍一档向听，战绩差则收紧
    const confSlack = conf >= 1.5 ? 1 : (conf <= -1.5 ? -1 : 0);
    if (style === 'conservative') {
        if (shanAfter > shanBefore + Math.max(0, confSlack)) return false;
    } else if (style === 'shrewd') {
        if (shanAfter > shanBefore + Math.max(0, (openCount === 0 ? 1 : 0) + confSlack)) return false;
    } else {
        // aggressive：允许为开门或有价值字牌略损向听
        if (shanAfter > shanBefore + Math.max(0, (openCount === 0 || isHonorValue ? 1 : 0) + confSlack)) return false;
    }

    // 未开门：优先碰（在向听可接受的前提下）
    if (openCount === 0) return true;

    // 已开门：要留得住将，或冲碰碰胡，或有价值字牌
    if (chasingPengPeng && shanAfter <= shanBefore) return true;
    if (isHonorValue && shanAfter <= shanBefore + 1) return true;
    return keepsJiang && shanAfter <= shanBefore;
}

// 除discarder外，检查是否有AI能碰（或杠）这张牌，且局势上值得碰
function findAiPeng(discarder, tile) {
    for (const p of ['top', 'left', 'right']) {
        if (p === discarder) continue;
        if (exposedMelds[p].length >= 3) continue; // 穷胡规则：不能手把一，最多3组面子在外
        if (canPeng(hands[p], tile) && shouldAiPeng(p, tile)) return p;
    }
    return null;
}

// 多家能胡这张牌时，按下家方向（离出牌人最近的下家优先）找第一个能胡的玩家，找不到返回null
function findRonPriority(discarder, tile) {
    const idx = turnOrder.indexOf(discarder);
    for (let step = 1; step <= 3; step++) {
        const p = turnOrder[(idx + step) % turnOrder.length];
        const hand = p === 'bottom' ? [...hands.bottom, tile] : [...hands[p], tile];
        if (checkHu(hand, exposedMelds[p], p)) return p;
    }
    return null;
}

function nextPlayerOf(p) {
    const idx = turnOrder.indexOf(p);
    return turnOrder[(idx + 1) % turnOrder.length];
}

// 只有出牌者的下家能吃；如果下家是AI，检查AI是否能吃
function findAiChi(discarder, tile) {
    const next = nextPlayerOf(discarder);
    if (next === 'bottom') return null; // 你的吃已经在别处处理
    if (isTenpai(next)) return null; // 已上听不吃，避免拆听
    if (exposedMelds[next].length >= 3) return null; // 穷胡规则：不能手把一
    const combos = findChiCombos(hands[next], tile);
    if (!combos.length) return null;
    // 在多种吃法里选评分最高且 shouldAiChi 通过的
    let best = null;
    let bestScore = -Infinity;
    for (const combo of combos) {
        if (!shouldAiChi(next, tile, combo)) continue;
        const sc = scoreChiCombo(hands[next], tile, combo, exposedMelds[next], next);
        if (sc > bestScore) {
            bestScore = sc;
            best = combo;
        }
    }
    return best ? { player: next, combo: best } : null;
}

function aiPengClaim(p, tile) {
    discardPile.pop();
    const cnt = hands[p].filter(x => x === tile).length;
    const useGang = cnt >= 3; // 凑齐3张暗的+这张，直接杠比碰更优
    const takeCount = useGang ? 3 : 2;
    takeTilesFromHand(p, tile, takeCount);
    currentIndex = turnOrder.indexOf(p);
    if (useGang) {
        exposedMelds[p].push({ type: 'gang', tiles: [tile, tile, tile, tile], concealed: false });
        logFlow(nameOf(p) + ' 杠了 ' + tileGlyph(tile));
        speak('杠' + tileName(tile));
        render();
        aiDrawReplacement(p);
    } else {
        exposedMelds[p].push({ type: 'peng', tiles: [tile, tile, tile] });
        logFlow(nameOf(p) + ' 碰了 ' + tileGlyph(tile));
        speak('碰' + tileName(tile));
        render();
        setTimeout(() => aiDiscard(p), 700);
    }
}

function aiChiClaim(p, tile, combo) {
    discardPile.pop();
    combo.forEach(t => {
        const idx = hands[p].indexOf(t);
        if (idx > -1) hands[p].splice(idx, 1);
    });
    const meldTiles = [...combo, tile].sort(tileCompare);
    exposedMelds[p].push({ type: 'chi', tiles: meldTiles });
    currentIndex = turnOrder.indexOf(p);
    logFlow(nameOf(p) + ' 吃了 ' + tileGlyph(tile));
    speak('吃' + tileName(tile));
    render();
    setTimeout(() => aiDiscard(p), 700);
}

// AI杠后摸替补牌，检查杠上开花，否则继续正常出牌
function aiDrawReplacement(p) {
    if (deck.length <= DEAD_WALL) { declareDraw(); return; }
    const drawn = deck.pop();
    const isLastTile = deck.length === DEAD_WALL;
    hands[p].push(drawn);
    hands[p].sort(tileCompare);
    render();
    if (checkHu(hands[p], exposedMelds[p], p)) {
        gameOver = true;
        winner = p;
        const before = [...hands[p]];
        before.splice(before.indexOf(drawn), 1);
        const bonus = scoreWinningHand(before, drawn, exposedMelds[p], true, isLastTile);
        const result = settleScore(p, 'selfdraw', null, bonus);
        logFlow(nameOf(p) + ' 杠上开花！自摸胡牌！' + result.detail);
        speak('胡了，自摸');
        learnFromWin(p, null);
        render();
        showResultModal(p, 'selfdraw', null, bonus, result, drawn);
        return;
    }
    setTimeout(() => aiDiscard(p), 700);
}

// 你放弃碰/吃/杠（或没有机会）之后：先看有没有AI能碰/杠，再看下家AI能不能吃，否则正常进入下一家
function resolveAiPengOrAdvance(discarder, tile) {
    const p = findAiPeng(discarder, tile);
    if (p) { aiPengClaim(p, tile); return; }
    const chi = findAiChi(discarder, tile);
    if (chi) { aiChiClaim(chi.player, tile, chi.combo); return; }
    advanceTurn();
}

function checkClaimOrAdvance(player, tile) {
    // 检查你是否可以碰/杠/吃这张牌（穷胡规则：不能手把一，最多3组面子在外，第4组必须留在手里）
    const canClaimMore = exposedMelds.bottom.length < 3;
    const canP = canClaimMore && canPeng(hands.bottom, tile);
    const canG = canClaimMore && canGang(hands.bottom, tile);
    const chiCombos = (canClaimMore && player === 'left') ? findChiCombos(hands.bottom, tile) : []; // 只能吃上家的牌
    if (canP || canG || chiCombos.length) {
        pendingClaim = { tile, fromPlayer: player, canPeng: canP, canGang: canG, chiCombos, mode: 'claim' };
        const options = [canG ? '杠' : null, canP ? '碰' : null, chiCombos.length ? '吃' : null].filter(Boolean).join('/');
        showIndicator('🔔 ' + options, true);
        logFlow('可以' + options + '，点✅执行 / 点❎过');
        return;
    }
    resolveAiPengOrAdvance(player, tile);
}

// 点✅：按 杠 > 碰 > 吃 优先级执行
function acceptClaim() {
    if (!pendingClaim) return;
    if (pendingClaim.mode === 'diceMenu') return; // 清零菜单用专用按钮，不走✅
    if (pendingClaim.mode === 'nextGame') {
        pendingClaim = null;
        hideIndicator();
        startGame();
        return;
    }
    if (pendingClaim.mode === 'selfGang') {
        executeSelfGang();
        return;
    }
    // 别人打牌的吃碰杠
    if (pendingClaim.canGang) { callGang(); return; }
    if (pendingClaim.canPeng) { callPeng(); return; }
    if (pendingClaim.chiCombos && pendingClaim.chiCombos.length) { callChi(); return; }
}

/** 从指定玩家手牌里移除最多 count 张指定牌（自家/AI 碰杠共用，从末尾往前找） */
function takeTilesFromHand(player, tile, count) {
    let removed = 0;
    const hand = hands[player];
    for (let i = hand.length - 1; i >= 0 && removed < count; i--) {
        if (hand[i] === tile) { hand.splice(i, 1); removed++; }
    }
    return removed;
}

function callGang() {
    if (gameOver) { logFlow('本局已结束'); return; }
    // 明杠：别人打出的牌，手里已有3张（由 acceptClaim 在 canGang 时调用）
    // 加杠/暗杠走 executeSelfGang，不在此重复
    if (!pendingClaim || !pendingClaim.canGang) { logFlow('现在不能杠'); return; }
    const { tile, fromPlayer } = pendingClaim;
    discardPile.pop();
    takeTilesFromHand('bottom', tile, 3);
    exposedMelds.bottom.push({ type: 'gang', tiles: [tile, tile, tile, tile], concealed: false });
    pendingClaim = null;
    currentIndex = turnOrder.indexOf('bottom');
    hideIndicator();
    logFlow('你杠了 ' + tileGlyph(tile) + '（' + nameOf(fromPlayer) + '打出），补牌中...');
    speak('杠' + tileName(tile));
    render();
    drawReplacementAndContinue();
}

// 杠后从牌墙补一张，检查杠上开花，否则等你出牌
function drawReplacementAndContinue() {
    if (deck.length <= DEAD_WALL) { declareDraw(); return; }
    const drawn = deck.pop();
    hands.bottom.push(drawn);
    hands.bottom.sort(tileCompare);
    lastDrawnIndex = hands.bottom.lastIndexOf(drawn);
    selectedIndex = null;
    render();
    if (checkHu(hands.bottom, exposedMelds.bottom, 'bottom')) {
        offerHu({ mode: 'selfdraw', concealed: hands.bottom }); // 杠上开花
        return;
    }
    offerSelfGangIfAny();
    logFlow('补牌：' + tileGlyph(drawn) + '，请出牌');
}

function handleDiscard(event) {
    if (gameOver) return;
    // 别人打牌的吃碰杠必须先处理；自己的可选杠不挡出牌
    if (pendingClaim && pendingClaim.mode !== 'selfGang') return;
    if (pendingClaim && pendingClaim.mode === 'selfGang') {
        pendingClaim = null;
        hideIndicator();
    }
    if (turnOrder[currentIndex] !== 'bottom') return; // 不是你的回合
    const target = event.target.closest('.tile');
    if (!target || target.dataset.index === undefined) return;
    const idx = parseInt(target.dataset.index, 10);
    if (isNaN(idx) || idx < 0 || idx >= hands.bottom.length) return;

    if (selectedIndex !== idx) {
        // 第一次点这张（或改按了别的牌）：标记➡️等待确认，不真正出牌
        selectedIndex = idx;
        render();
        return;
    }

    // 再次点同一张：真正打出
    const card = hands.bottom[idx];
    hands.bottom.splice(idx, 1);
    discardPile.push({ player: 'bottom', tile: card });
    selectedIndex = null;
    lastDrawnIndex = null;
    speak(tileName(card));
    logFlow('你打出了 ' + tileGlyph(card));
    render();

    // 检查是否有AI能胡你打出的这张牌
    const ronPlayer = findRonPriority('bottom', card);
    if (ronPlayer) {
        discardPile.pop();
        hands[ronPlayer].push(card);
        gameOver = true;
        winner = ronPlayer;
        const before = [...hands[ronPlayer]];
        before.splice(before.indexOf(card), 1);
        const bonus = scoreWinningHand(before, card, exposedMelds[ronPlayer], false, false);
        const result = settleScore(ronPlayer, 'dianpao', 'bottom', bonus);
        logFlow(nameOf(ronPlayer) + ' 点炮胡了你打出的牌！' + result.detail);
        speak('胡了，' + voiceName('bottom') + '点炮');
        learnFromWin(ronPlayer, 'bottom');
        render();
        showResultModal(ronPlayer, 'dianpao', 'bottom', bonus, result, card);
        return;
    }
    resolveAiPengOrAdvance('bottom', card);
}

function advanceTurn() {
    if (gameOver) return;
    currentIndex = (currentIndex + 1) % turnOrder.length;
    setTimeout(() => nextTurn(), 500);
}

// ---------- 渲染 ----------
function renderTile(t, idx, clickable) {
    let marker = '';
    if (idx === selectedIndex) marker = '➡️';
    else if (idx === lastDrawnIndex) marker = '⬇️';
    const danger = isDangerousTile(t) ? 'danger' : '';
    return `<div class="tile-wrap"><div class="tile-marker">${marker}</div><div class="tile ${clickable ? '' : 'disabled'} ${danger}" data-index="${idx}">${tileGlyph(t)}</div></div>`;
}

function renderExposedFace(t) {
    return `<div class="tile-wrap"><div class="tile-marker"></div><div class="tile exposed">${tileGlyph(t)}</div></div>`;
}

function renderExposedBack() {
    return `<div class="tile-wrap"><div class="tile-marker"></div><div class="tileback">🀫</div></div>`;
}

// 按组渲染一组已亮出的牌：亮牌(风/箭)用黑色虚线框；暗杠用黄色虚线框，3张扣着1张露出(避免完全认不出是什么牌)；其余照常整组亮出
function renderMeldGroup(m) {
    let cls = 'meld-group';
    if (m.type === 'winds' || m.type === 'dragons') cls += ' reveal-group';
    if (m.type === 'gang' && m.concealed) cls += ' angang-group';

    let tilesHtml;
    if (m.type === 'gang' && m.concealed) {
        tilesHtml = renderExposedFace(m.tiles[0]) + renderExposedBack() + renderExposedBack() + renderExposedBack();
    } else {
        tilesHtml = m.tiles.map(renderExposedFace).join('');
    }
    return `<div class="${cls}">${tilesHtml}</div>`;
}


function openPoolModal() {
    renderPoolGrid();
    const modal = $('pool-modal');
    if (modal) modal.classList.add('show');
    logFlow('牌池：已弃出 ' + discardPile.length + ' 张，可上下滑动查看');
}
function closePoolModal() {
    const modal = $('pool-modal');
    if (modal) modal.classList.remove('show');
}
function renderPoolGrid() {
    const grid = $('pool-grid');
    if (!grid) return;
    const count = $('pool-box-count');
    if (count) count.textContent = '（' + discardPile.length + ' 张）';
    const sortedPool = [...discardPile].sort((a, b) => poolTileCompare(a.tile, b.tile));
    grid.innerHTML = sortedPool.length
        ? sortedPool.map(d => `<div class="pool-tile">${tileGlyph(d.tile)}</div>`).join('')
        : '<div class="pool-empty">暂无弃牌</div>';
}

function render() {
    for (let p in hands) {
        const isBottom = p === 'bottom';
        const isMyTurn = isBottom && turnOrder[currentIndex] === 'bottom' && !gameOver && (!pendingClaim || pendingClaim.mode === 'selfGang');
        let html = '';
        if (isBottom) {
            html += hands[p].map((t, idx) => renderTile(t, idx, isMyTurn)).join('');
            exposedMelds[p].forEach(m => { html += renderMeldGroup(m); });
            $('hand-' + p).innerHTML = html;
        } else {
            // AI 暗牌不显示；副露直接挂在头像下方，最多三行
            $('hand-' + p).innerHTML = '';
            const expEl = $('exposed-' + p);
            if (expEl) {
                expEl.innerHTML = (exposedMelds[p] || []).map(renderMeldGroup).join('');
            }
        }
    }
    const wall = $('discardWall');
    // 竖屏按原版显示最近 24 张；横屏保持 12 张以免侧栏过挤
    const isPortrait = document.body && document.body.classList.contains('portrait-layout');
    const discardView = discardPile.slice(isPortrait ? -24 : -12);
    wall.innerHTML = discardView.map((d, i, arr) =>
        `<div class="discardTile${i === arr.length - 1 ? ' latest' : ''}">${tileGlyph(d.tile)}</div>`).join('');
    $('wall-count-text').innerText = '牌墙: ' + deck.length + ' 张' + (aiLearn.games > 0 ? ' · 💡' + aiLearn.games : '');
    $('wall-count-text').title = aiLearn.games > 0
        ? 'AI已学习' + aiLearn.games + '局：保守' + aiLearn.confidence.conservative.toFixed(1)
            + ' 激进' + aiLearn.confidence.aggressive.toFixed(1) + ' 精明' + aiLearn.confidence.shrewd.toFixed(1)
        : '';
    const poolModal = $('pool-modal');
    if (poolModal && poolModal.classList.contains('show')) renderPoolGrid();
    markDealer();
    if (exposedInfoShownFor && document.body && document.body.classList.contains('portrait-layout')) {
        try { showExposedInfo(exposedInfoShownFor); } catch (e) {}
    }
    fitBottomHand();
}

// ---------- 横屏底牌自适应：无论手牌+吃碰杠亮组有多少张（含最多三次杠），
// 都通过等比缩放让它们在同一行内完整显示，不换行、不重叠、不需要滚动 ----------
function fitBottomHand() {
    const handEl = $('hand-bottom');
    if (!handEl) return;
    // 竖屏：完全按原版固定 29×39 + 横向滑动，不做缩放
    if (document.body && document.body.classList.contains('portrait-layout')) {
        handEl.style.overflowX = 'auto';
        handEl.style.justifyContent = 'flex-start';
        handEl.style.setProperty('--tile-w', '29px');
        handEl.style.setProperty('--tile-h', '39px');
        handEl.style.setProperty('--tile-fs', '29px');
        return;
    }
    const baseW = 29, baseH = 39, baseFS = 29;
    const MIN_SCALE = 0.42;
    handEl.style.overflowX = 'hidden';
    handEl.style.justifyContent = 'center';
    handEl.style.setProperty('--tile-w', baseW + 'px');
    handEl.style.setProperty('--tile-h', baseH + 'px');
    handEl.style.setProperty('--tile-fs', baseFS + 'px');
    const container = handEl.parentElement;
    if (!container) return;
    const availWidth = container.clientWidth;
    const naturalWidth = handEl.scrollWidth;
    if (availWidth > 0 && naturalWidth > availWidth) {
        let scale = availWidth / naturalWidth;
        if (scale < MIN_SCALE) scale = MIN_SCALE;
        handEl.style.setProperty('--tile-w', (baseW * scale).toFixed(2) + 'px');
        handEl.style.setProperty('--tile-h', (baseH * scale).toFixed(2) + 'px');
        handEl.style.setProperty('--tile-fs', (baseFS * scale).toFixed(2) + 'px');
        requestAnimationFrame(() => {
            if (handEl.scrollWidth > container.clientWidth + 1) {
                handEl.style.overflowX = 'auto';
            }
        });
    }
}

function rotateDealer() {
    // 有人胡牌：赢家是庄家就连庄，否则下庄
    // 流局（winner为null）：无条件连庄
    const dealerStays = winner === null ? true : (winner === dealer);
    if (!dealerStays) dealer = nextPlayerOf(dealer);
}

function startGame() {
    rotateDealer();
    initGame();
}


// 🤫🚫：主动放弃当前可以碰/吃/杠的机会，不用等10秒超时
function declineClaim() {
    if (!pendingClaim) { logFlow('现在没有可以碰/吃/杠的牌'); return; }
    if (pendingClaim.mode === 'diceMenu') return;
    const mode = pendingClaim.mode;
    const fromPlayer = pendingClaim.fromPlayer;
    const tile = pendingClaim.tile;
    pendingClaim = null;
    hideIndicator();
    if (mode === 'nextGame') {
        startGame(); // 流局后点❎也开下一局
        return;
    }
    if (mode === 'selfGang') {
        logFlow('你选择不杠，请出牌');
        return; // 自己回合，继续等你出牌
    }
    logFlow('你选择不吃/碰/杠');
    resolveAiPengOrAdvance(fromPlayer, tile);
}

// 直接判定胡牌并结算：不再需要逐项确认条件，一步到位显示胡牌内容
function offerHu(ctx) {
    hideIndicator();
    let winTile, before, isSelfDraw, isLastTile, payer = null;
    if (ctx.mode === 'dianpao') {
        winTile = ctx.tile;
        before = [...hands.bottom];
        discardPile.pop();
        hands.bottom.push(ctx.tile);
        isSelfDraw = false;
        isLastTile = false;
        payer = ctx.fromPlayer;
    } else {
        winTile = lastDrawnTile.bottom;
        before = [...hands.bottom];
        const idx = before.indexOf(winTile);
        if (idx > -1) before.splice(idx, 1);
        isSelfDraw = true;
        isLastTile = lastDrawWasFinal.bottom;
    }

    const bonus = scoreWinningHand(before, winTile, exposedMelds.bottom, isSelfDraw, isLastTile);
    gameOver = true;
    winner = 'bottom';
    const result = isSelfDraw
        ? settleScore('bottom', 'selfdraw', null, bonus)
        : settleScore('bottom', 'dianpao', payer, bonus);
    logFlow('你胡牌了！' + result.detail);
    speak(isSelfDraw ? '胡了，自摸' : '胡了，' + voiceName(payer) + '点炮');
    learnFromWin('bottom', payer);
    render();
    showResultModal('bottom', isSelfDraw ? 'selfdraw' : 'dianpao', payer, bonus, result, winTile);
}

function callPeng() {
    if (!pendingClaim || !pendingClaim.canPeng) { logFlow('现在不能碰'); return; }
    const { tile, fromPlayer } = pendingClaim;
    discardPile.pop(); // 这张牌被拿走，不再留在弃牌堆
    takeTilesFromHand('bottom', tile, 2);
    exposedMelds.bottom.push({ type: 'peng', tiles: [tile, tile, tile] });
    pendingClaim = null;
    currentIndex = turnOrder.indexOf('bottom');
    hideIndicator();
    selectedIndex = null;
    lastDrawnIndex = null;
    logFlow('你碰了 ' + tileGlyph(tile) + '（' + nameOf(fromPlayer) + '打出），请出牌');
    speak('碰' + tileName(tile));
    render();
}

function callChi() {
    if (!pendingClaim || !pendingClaim.chiCombos || !pendingClaim.chiCombos.length) { logFlow('现在不能吃'); return; }
    if (pendingClaim.chiCombos.length === 1) {
        executeChi(pendingClaim.chiCombos[0]);
        return;
    }
    // 有两种以上吃法，弹窗给选择权（冷色紧凑牌面，与结算页一致）
    const opts = $('chi-choice-options');
    opts.innerHTML = pendingClaim.chiCombos.map((combo, i) => {
        const tiles = [...combo, pendingClaim.tile].sort(tileCompare);
        const tilesHtml = tiles.map(t =>
            `<div class="tile-wrap"><div class="tile-marker"></div><div class="tile exposed">${tileGlyph(t)}</div></div>`
        ).join('');
        return `<div class="hu-opt enabled" onclick="chooseChiCombo(${i})">${tilesHtml}</div>`;
    }).join('');
    $('chi-choice-modal').classList.add('show');
}

function chooseChiCombo(i) {
    const combo = pendingClaim.chiCombos[i];
    $('chi-choice-modal').classList.remove('show');
    executeChi(combo);
}

/** 取消吃法选择 = 过牌，交给 AI 碰/下家流程 */
function closeChiChoice() {
    $('chi-choice-modal').classList.remove('show');
    if (pendingClaim && pendingClaim.mode === 'claim') declineClaim();
}

function executeChi(combo) {
    const { tile } = pendingClaim;
    discardPile.pop();
    combo.forEach(t => {
        const idx = hands.bottom.indexOf(t);
        if (idx > -1) hands.bottom.splice(idx, 1);
    });
    const meldTiles = [...combo, tile].sort(tileCompare);
    exposedMelds.bottom.push({ type: 'chi', tiles: meldTiles });
    pendingClaim = null;
    currentIndex = turnOrder.indexOf('bottom');
    hideIndicator();
    selectedIndex = null;
    lastDrawnIndex = null;
    logFlow('你吃了 ' + tileGlyph(tile) + '，请出牌');
    speak('吃' + tileName(tile));
    render();
}


// 弹窗打开时锁定页面滚动，避免底层与弹层抢惯性
function syncBodyScrollLock() {
    const ids = ['result-modal', 'reveal-modal', 'chi-choice-modal', 'pool-modal'];
    const open = ids.some(id => {
        const el = $(id);
        return el && el.classList.contains('show');
    });
    const body = document.body;
    if (open) {
        if (!body.classList.contains('modal-open')) {
            body.dataset.scrollY = String(window.scrollY || window.pageYOffset || 0);
            body.classList.add('modal-open');
            body.style.top = `-${body.dataset.scrollY}px`;
        }
    } else if (body.classList.contains('modal-open')) {
        const y = parseInt(body.dataset.scrollY || '0', 10) || 0;
        body.classList.remove('modal-open');
        body.style.top = '';
        delete body.dataset.scrollY;
        window.scrollTo(0, y);
    }
}
(function watchModalsForScrollLock() {
    const ids = ['result-modal', 'reveal-modal', 'chi-choice-modal', 'pool-modal'];
    const obs = new MutationObserver(syncBodyScrollLock);
    ids.forEach(id => {
        const el = $(id);
        if (el) obs.observe(el, { attributes: true, attributeFilter: ['class'] });
    });
})();


/** 按住牌桌上下拖动：平移整个界面（不改规则逻辑） */
const VIEW_PAN_STORAGE_KEY = 'qionghu_mahjong_view_pan_y_v1';
const VIEW_PAN_MAX = 180; /* px，相对中心上下限 */
let viewPanY = 0;
let panDrag = null; // { startY, startPan }

function loadSavedViewPan() {
    try {
        const raw = localStorage.getItem(VIEW_PAN_STORAGE_KEY);
        if (raw == null) return 0;
        const n = parseFloat(raw);
        return isFinite(n) ? n : 0;
    } catch (e) { return 0; }
}
function applyViewPan() {
    viewPanY = Math.max(-VIEW_PAN_MAX, Math.min(VIEW_PAN_MAX, viewPanY));
    document.documentElement.style.setProperty('--view-pan-y', viewPanY.toFixed(1) + 'px');
    try { localStorage.setItem(VIEW_PAN_STORAGE_KEY, String(viewPanY)); } catch (e) {}
}
function initTablePan() {
    const wrap = document.getElementById('table-wrap');
    const frame = document.getElementById('table-frame');
    if (!wrap || !frame) return;
    viewPanY = loadSavedViewPan();
    applyViewPan();

    const isInteractive = (t) => !!(t && t.closest && t.closest(
        '.tile, .tileback, .discardTile, .pool-tile, .player-label, button, .meld-group, #claim-indicator, #wall-count, #landscape-ctrl, #discard-query-btn, #discardWall, #pool-modal, #result-modal, #reveal-modal, #chi-choice-modal, img, .claim-btn, .reset-btn, .avatar, input'
    ));

    const onStart = (clientY, target) => {
        if (isInteractive(target)) return false;
        if (document.body.classList.contains('modal-open')) return false;
        panDrag = { startY: clientY, startPan: viewPanY };
        wrap.classList.add('panning');
        return true;
    };
    const onMove = (clientY) => {
        if (!panDrag) return;
        const dy = clientY - panDrag.startY;
        viewPanY = panDrag.startPan + dy;
        applyViewPan();
    };
    const onEnd = () => {
        if (!panDrag) return;
        panDrag = null;
        wrap.classList.remove('panning');
        applyViewPan();
    };

    frame.addEventListener('pointerdown', (e) => {
        if (e.button != null && e.button !== 0) return;
        if (!onStart(e.clientY, e.target)) return;
        try { frame.setPointerCapture(e.pointerId); } catch (err) {}
    });
    frame.addEventListener('pointermove', (e) => {
        if (!panDrag) return;
        onMove(e.clientY);
    });
    frame.addEventListener('pointerup', onEnd);
    frame.addEventListener('pointercancel', onEnd);
    // 避免拖动时触发三连击骰子：移动超过阈值则清空 tap
    frame.addEventListener('pointermove', (e) => {
        if (!panDrag) return;
        if (Math.abs(e.clientY - panDrag.startY) > 8) {
            tableTapTimes = [];
        }
    });
}

initTablePan();
initDicePips();
// 先按原始比例量一次桌面，记下「正常大小」，再应用（可能已保存的）缩放
viewScale = ORIGINAL_VIEW_SCALE;
document.documentElement.style.setProperty('--view-scale', '1');
setTimeout(() => {
    captureOriginalViewSize();
    viewScale = loadSavedViewScale();
    applyViewScale();
}, 0);
// 启动：有完整存档则原样恢复，否则只带积分/庄家开新局
if (loadGameProgress()) {
    resumeFromSave();
} else {
    initGame();
}
