<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#05080e">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-status-bar-style" content="black-translucent">
<title>极简麻将 · 横竖自适应</title>
<style>
    /* —— 设计令牌：冷色基底 + 金色点缀 —— */
    :root {
        --gold: #d4af37;
        --gold-soft: rgba(212, 175, 55, 0.55);
        --gold-dim: rgba(212, 175, 55, 0.28);
        --ice: #8ec8f0;
        --text: #d6e4f0;
        --text-muted: #8aa0b5;
        --glass-strong: rgba(14, 22, 34, 0.72);
        --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.4);
        --font-ui: "Songti SC", "STSong", "PingFang SC", "SimSun", serif;
        /* 侧区牌面 = 手牌基准 29×39 的 66% */
        --side-tile-w: 19.14px;
        --side-tile-h: 25.74px;
        --side-tile-fs: 19.14px;
        --side-tileback-w: 11.3px;
        --side-tileback-h: 16px;
        --side-tileback-fs: 7.3px;
        /* iOS 安全区：constant 兼容旧 iOS，env 为标准 */
        --sat: 0px;
        --sar: 0px;
        --sab: 0px;
        --sal: 0px;
        --sat: constant(safe-area-inset-top);
        --sar: constant(safe-area-inset-right);
        --sab: constant(safe-area-inset-bottom);
        --sal: constant(safe-area-inset-left);
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        /* iOS Safari：用 JS 写入的可视宽高，避免 100vh 含地址栏空白 */
        --app-width: 100vw;
        --app-height: 100vh;
        --app-width: 100dvw;
        --app-height: 100dvh;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
        background:
            radial-gradient(ellipse at 50% 12%, rgba(120, 170, 220, 0.08), transparent 50%),
            radial-gradient(ellipse at 50% 80%, rgba(212, 175, 55, 0.05), transparent 45%),
            radial-gradient(ellipse at center, #15202e 0%, #0b121c 55%, #05080e 100%);
        color: var(--text);
        font-family: var(--font-ui);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        height: 100vh; overflow: hidden; gap: 8px;
    }
    body.modal-open {
        overflow: hidden !important;
        touch-action: none;
        /* 防止 iOS 橡皮筋带动整页 */
        position: fixed;
        width: 100%;
        left: 0;
        right: 0;
    }
    #table-frame {
        position: relative;
        width: min(96vw, 200vh);
        height: min(92vh, 52vw);
        border: 1.5px solid var(--gold);
        border-radius: 18px;
        box-shadow:
            0 16px 40px rgba(0,0,0,0.55),
            0 0 0 1px rgba(212,175,55,0.18),
            inset 0 0 0 1px rgba(255,255,255,0.04);
        transform: translateZ(0);
    }
    #game-table {
        width: 100%; height: 100%; position: relative;
        background:
            radial-gradient(circle at 50% 38%, rgba(255,255,255,0.06), transparent 52%),
            repeating-linear-gradient(45deg, rgba(212,175,55,0.04) 0, rgba(212,175,55,0.04) 1px, transparent 1px, transparent 26px),
            repeating-linear-gradient(-45deg, rgba(212,175,55,0.04) 0, rgba(212,175,55,0.04) 1px, transparent 1px, transparent 26px),
            linear-gradient(160deg, #1a4d38 0%, #153d2c 40%, #0f2e22 100%);
        border-radius: 20px;
        box-shadow: inset 0 0 48px rgba(0,0,0,0.55);
        overflow: hidden;
    }
    .player { position: absolute; padding: 3px 6px; background: transparent; border: none;
        text-align: center; font-size: 12px; color: var(--text); }
    .top { top: 1%; left: 50%; transform: translateX(-50%); }
    .left { left: calc(21% + 58.5px); top: calc(50% - 46.8px); transform: translateY(-50%) rotate(90deg); }
    .right { right: calc(21% + 58.5px); top: calc(50% - 46.8px); transform: translateY(-50%) rotate(90deg); }
    /* 左右家头像正向：由 .player-side-stack 统一 rotate(-90deg) 抵消 */
    .bottom { bottom: 0; left: 50%; transform: translateX(-50%); max-width: 94%;
        display: flex; flex-direction: column; align-items: center;
        border: none; background: transparent; padding: 4px 8px 2px;
        --hand-tile-h: 39px; }
    .bottom .player-label { order: 1; }
    .bottom #flow-log { order: 2; margin-top: calc(var(--hand-tile-h, 39px) * 0.15); }
    .bottom #hand-bottom { order: 3; margin-bottom: 2px; }

    /* 任何提示都不得挡住自家手牌 */
    .player.bottom {
        z-index: 40;
    }
    .bottom #hand-bottom, .bottom .hand {
        position: relative;
        z-index: 41;
    }
    #flow-log {
        position: relative;
        z-index: 40;
    }

    .top .hand, .left .hand, .right .hand { display: none; }
    /* AI 副露：头像正下方、与手牌同向不旋转；尺寸=原侧牌 60%
       自动换行：横向空间够就同一行紧凑排列，放不下则换行，最多叠三行 */
    .ai-exposed {
        display: flex;
        flex-flow: row wrap;
        justify-content: center;
        align-content: flex-start;
        gap: 1px;
        margin-top: 3px;
        max-width: 168px;
        max-height: calc((var(--side-tile-h) * 0.69 + 3px) * 3 + 2px);
        overflow: hidden;
        pointer-events: none;
        position: relative;
        z-index: 9;
    }
    /* 左右家可横向利用的空间比顶部窄，缩小单行宽度，更容易换行叠放 */
    .left .ai-exposed, .right .ai-exposed {
        max-width: 108px;
    }
    .ai-exposed:empty { display: none; }
    .ai-exposed .meld-group {
        display: flex;
        gap: 1px;
        padding: 1px 2px;
        border-radius: 3px;
        flex-shrink: 0;
    }
    .ai-exposed .tile {
        width: calc(var(--side-tile-w) * 0.69);
        height: calc(var(--side-tile-h) * 0.69);
        font-size: calc(var(--side-tile-fs) * 0.69);
        border-radius: 2px;
        cursor: default;
    }
    .ai-exposed .tileback {
        width: calc(var(--side-tileback-w) * 0.69);
        height: calc(var(--side-tileback-h) * 0.69);
        font-size: calc(var(--side-tileback-fs) * 0.69);
        border-radius: 2px;
    }
    .ai-exposed .tile-marker { height: 0; font-size: 0; }
    /* 左右家：用侧向堆叠容器抵消父级 90°，副露与头像保持正向、头像正下方 */
    .player-side-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .left .player-side-stack,
    .right .player-side-stack {
        transform: rotate(-90deg);
        transform-origin: center center;
    }
    .player-label {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        cursor: default; padding: 3px 7px; border-radius: 8px;
        background: transparent;
        position: relative; z-index: 8; pointer-events: auto;
    }
    .avatar {
        font-size: 27px;
        position: relative;
        display: inline-block;
        border-radius: 50%;
        line-height: 0;
        z-index: 8;
        pointer-events: auto;
    }
    .avatar img {
        width: 44px; height: 44px; display: block; object-fit: cover; border-radius: 50%;
        border: none;
        background: transparent;
        box-shadow: 0 2px 6px rgba(0,0,0,0.45);
        filter: none;
        position: relative;
        z-index: 1;
    }
    /* 外侧光晕环：只画在头像外缘，不作用在面部像素上 */
    .avatar::after {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        opacity: 0;
        box-shadow: none;
        transition: opacity 0.2s ease;
    }
    .player-score {
        font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
        color: var(--ice); opacity: 0.95;
        text-shadow: 0 1px 2px rgba(0,0,0,0.45);
    }
    .hand { display: flex; flex-wrap: nowrap; gap: 1px; margin-top: 5px; justify-content: center; overflow: visible; }
    .bottom .hand {
        --tile-w: 29px; --tile-h: 39px; --tile-fs: 29px;
        flex-wrap: nowrap; overflow-x: hidden; overflow-y: hidden; justify-content: center;
        width: 100%;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        touch-action: pan-x;
        padding-bottom: 0;
    }
    /* 底牌区所有牌（含吃碰杠亮的组）统一按 --tile-w/--tile-h/--tile-fs 缩放，
       以便无论多少张牌（含最多三次杠）都能不换行、不重叠地在一行内同时显示 */
    .bottom .hand .tile { width: var(--tile-w); height: var(--tile-h); font-size: var(--tile-fs); }
    .bottom .hand .tileback { width: calc(var(--tile-w) * 0.59); height: calc(var(--tile-h) * 0.62); font-size: calc(var(--tile-fs) * 0.38); }
    .bottom .hand .tile-marker { font-size: calc(var(--tile-fs) * 0.34); height: calc(var(--tile-fs) * 0.41); }
    .tile-wrap { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .tile-marker { font-size: 10px; line-height: 1; height: 12px; color: var(--gold); }
    .tile {
        width: 29px; height: 39px; cursor: pointer; flex-shrink: 0; border-radius: 5px;
        background: linear-gradient(160deg, #fbfaf3 0%, #ece7d6 55%, #ddd6bd 100%);
        border: 1px solid rgba(180,165,120,0.55);
        box-shadow: 0 2px 3px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.85);
        display: flex; justify-content: center; align-items: center;
        font-size: 29px; line-height: 1; color: #2a2a2a;
    }
    .tile.disabled { cursor: default; }
    .tile.exposed { opacity: 0.85; }
    .tile.danger {
        border: 1.5px solid #e06a6a;
        box-shadow: 0 0 6px rgba(224,106,106,0.7), inset 0 1px 1px rgba(255,255,255,0.7);
    }
    .tile.win-glow {
        opacity: 1;
        border: 1.5px solid var(--gold);
        box-shadow: 0 0 10px 2px rgba(212,175,55,0.75), 0 0 16px 4px rgba(142,200,240,0.25);
        animation: winGlowPulse 1.4s ease-in-out infinite;
    }
    @keyframes winGlowPulse {
        0%, 100% { box-shadow: 0 0 8px 2px rgba(212,175,55,0.6), 0 0 12px 3px rgba(142,200,240,0.2); }
        50% { box-shadow: 0 0 14px 4px rgba(212,175,55,0.9), 0 0 20px 6px rgba(142,200,240,0.35); }
    }
    .meld-group { display: flex; gap: 1px; padding: 2px 3px; border-radius: 4px; flex-shrink: 0; }
    .meld-group.reveal-group {
        background: transparent;
        border: 1px solid var(--gold);
        border-radius: 5px;
    }
    .meld-group.angang-group {
        background: transparent;
        border: 1px solid rgba(100, 160, 220, 0.65);
        border-radius: 5px;
    }
    /* 牌墙与统计：现移至左侧空地，纵向排布，无背景无边框，贴近原版轻量显示 */
    #wall-count {
        position: absolute; top: 7%; left: 1.5%; width: 16%; height: 84%; z-index: 6;
        padding: 0;
        font-size: 11px; color: #c5d4e0; text-align: left;
        background: transparent;
        border: none;
        box-shadow: none;
        opacity: 0.92;
        overflow-y: auto; overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
        touch-action: pan-y;
    }
    #wall-count-gap { height: 12px; }
    #player-stats { display: flex; flex-direction: column; gap: 4px; }
    .stat-line { font-size: 12px; line-height: 1.3; color: #c5d4e0; white-space: nowrap; letter-spacing: 0.02em; }
    .stat-row { display: none; gap: 5px; }
    body.portrait-layout .stat-row { display: flex; }
    .stat-cell { width: 18px; font-size: 11px; line-height: 1.3; color: #c5d4e0; }
    .stat-row.avatar-row .stat-cell { font-size: 13px; }
    #table-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(var(--view-pan-y, 0px)) scale(var(--view-scale, 1));
        transform-origin: center center;
        transition: transform 0.18s ease;
        touch-action: none; /* 桌面拖动由脚本处理上下平移 */
        /* 强制整体（边框+内部牌桌）作为同一合成层绘制，避免部分安卓/WebView
           在缩放时出现"金边框已变、内部圆角裁剪内容未跟着重绘"的错位 */
        will-change: transform;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
    }
    #table-wrap.panning {
        transition: none;
    }
    /* 头像随桌面等比缩放（在 #table-wrap 内，勿单独反缩放） */
    .avatar, .avatar img, .player-label, .player-score {
        transform: none;
    }
    /* 弹层内容与桌面同一缩放比例（相对原始正常大小） */
    #result-modal .result-box,
    #reveal-modal .hu-box,
    #chi-choice-modal .hu-box {
        transform: scale(var(--view-scale, 1));
        transform-origin: center center;
        transition: transform 0.18s ease;
    }
    /* 左侧顶栏：TP制作 + 牌墙 + 横屏调整；下方 扩大/缩小 */
    #img-display-badge {
        position: static;
        top: auto; left: auto;
        z-index: 7;
        padding: 0 2px 0 0;
        border: none;
        color: var(--gold);
        background: transparent;
        font-size: 9.23px;
        font-weight: 500;
        letter-spacing: 0.04em;
        white-space: nowrap;
        line-height: 1.2;
        cursor: default;
        user-select: none;
        font-family: "STZhongsong", "华文中宋", "FZXiaoBiaoSong-B05S", "方正小标宋", "KaiTi", "楷体", "SimSun", serif;
        flex-shrink: 0;
    }
    #wall-count-header {
        display: flex; flex-direction: column; align-items: center;
        gap: 3px;
        margin-bottom: 4px;
        text-align: center;
    }
    #wall-count-row {
        display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
        gap: 3px 5px;
    }
    #wall-count-text {
        margin-bottom: 0; color: #c5d4e0; font-weight: normal; letter-spacing: 0; text-align: center;
        font-size: 11px;
    }
    #landscape-ctrl {
        position: relative;
        left: auto; top: auto;
        transform: none;
        z-index: 7;
        width: auto; height: auto;
        min-width: 0; min-height: 0;
        padding: 0 2px;
        display: inline;
        border: none;
        border-radius: 0;
        background: transparent !important;
        box-shadow: none !important;
        color: var(--gold);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        line-height: 1.2;
        font-family: inherit;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 0.15s, opacity 0.15s;
    }
    /* 热区略微扩大，不影响视觉尺寸 */
    #landscape-ctrl::after {
        content: '';
        position: absolute;
        inset: -4px -3px;
    }
    #landscape-ctrl:active {
        background: transparent !important;
        box-shadow: none !important;
        transform: none;
        opacity: 0.7;
        color: var(--ice);
    }
    #view-scale-btns {
        display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    #view-scale-btns button {
        position: relative;
        margin: 0;
        padding: 2px 7px;
        min-width: 30px;
        border: 1px solid var(--gold-dim);
        border-radius: 4px;
        background: transparent;
        color: var(--text-muted);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.06em;
        font-family: inherit;
        line-height: 1.35;
        cursor: pointer;
        user-select: none;
        box-shadow: none;
        transition: color 0.12s, border-color 0.12s, background 0.12s;
    }
    /* 热区略微扩大，不影响视觉尺寸 */
    #view-scale-btns button::after {
        content: '';
        position: absolute;
        inset: -4px -2px;
    }
    #view-scale-btns button:active {
        color: var(--gold);
        border-color: var(--gold);
        background: rgba(212, 175, 55, 0.1);
    }
    #view-scale-btns button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
    }
    .tileback {
        width: 17px; height: 24px; border-radius: 3px; flex-shrink: 0;
        background: linear-gradient(145deg, #3a5a78, #1e3348);
        border: 1px solid rgba(120, 160, 200, 0.25);
        box-shadow: inset 0 0 4px rgba(0,0,0,0.45);
        display: flex; justify-content: center; align-items: center; font-size: 11px;
    }
    #flow-log {
        margin-top: 14px; min-height: 30px; padding: 3px 10px;
        font-size: 12px; color: var(--text-muted); text-align: center;
        letter-spacing: 0.03em; line-height: 1.4;
    }
    .active .avatar img {
        /* 面部保持原图，不加滤镜、不加贴脸高光 */
        filter: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.45);
    }
    .active .avatar::after {
        opacity: 1;
        box-shadow:
            0 0 0 1.5px rgba(212, 175, 55, 0.5),
            0 0 12px 4px rgba(212, 175, 55, 0.4),
            0 0 22px 8px rgba(142, 200, 240, 0.18);
    }
    /* 牌池入口：右侧，与左侧「牌墙: xx 张」同一水平线；下方与废牌池间隔半张牌 */
    #discard-query-btn {
        position: absolute;
        right: 1.5%;
        top: 7%;
        z-index: 11;
        width: 16%;
        box-sizing: border-box;
        margin: 0;
        padding: 2px 0;
        border: none;
        background: transparent;
        color: var(--gold);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        font-family: inherit;
        line-height: 1.3;
        text-align: center;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        box-shadow: none;
        text-decoration: underline;
        text-decoration-color: var(--gold-dim);
        text-underline-offset: 2px;
        transition: color 0.12s;
    }
    /* 热区略微扩大：上/左/右留白更多，底部少留避免遮住废牌区 */
    #discard-query-btn::after {
        content: '';
        position: absolute;
        top: -6px; left: -6px; right: -6px; bottom: -2px;
    }
    #discard-query-btn:active {
        color: var(--ice);
    }
    #discard-query-btn.active {
        color: var(--ice);
    }
    #discardWall {
        /* 与查牌池按钮同列；按钮底边 + 半张废牌高度 */
        position: absolute; right: 1.5%;
        top: calc(7% + 1.3em + 12.87px);
        width: 16%; height: 54%;
        display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: min-content;
        align-content: flex-start; justify-items: center; gap: 2px;
        background: transparent; border: none; padding: 4px;
        overflow-y: auto; overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
        touch-action: pan-y;
        box-sizing: border-box;
    }

    /* ===== 牌池弹层：点击「点击查询牌池」展开，全部弃牌，每行 8 张，可上下滑动 ===== */
    #pool-modal {
        display: none; position: fixed; inset: 0; z-index: 55;
        justify-content: center; align-items: safe center;
        padding: 10px 0;
        overflow-x: auto; overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        touch-action: pan-x pan-y;
        background: rgba(8, 14, 24, 0.72);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
    }
    #pool-modal.show { display: flex; }
    .pool-box {
        width: min(88vw, 520px);
        max-height: min(72vh, 360px);
        margin: auto;
        padding: 8px 12px 10px;
        border-radius: 10px;
        color: var(--text);
        background: var(--glass-strong);
        border: 1px solid var(--gold);
        box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.06);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }
    .pool-box-header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 7px; flex-shrink: 0;
    }
    .pool-box-title {
        font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
        color: var(--ice);
    }
    .pool-box-count {
        font-size: 8px; color: var(--text-muted); margin-left: 6px; font-weight: 400;
    }
    .pool-box-close {
        border: 1px solid var(--gold-dim);
        background: transparent;
        color: var(--text-muted);
        border-radius: 5px;
        width: 18px; height: 18px;
        line-height: 1; font-size: 11px;
        cursor: pointer;

    /* 黄金镶钻 3D 立方体骰子 */
    #dice-stage {
        position: absolute; left: 0; right: 0; top: 0; bottom: 22%;
        z-index: 25;
        display: none; align-items: center; justify-content: center;
        pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(8,14,24,0.35) 0%, transparent 65%);
        contain: layout style;
        perspective: 320px;
        perspective-origin: 50% 40%;
    }
    #dice-stage.show { display: flex; }
    #dice-scene {
        width: 21.6px; height: 21.6px;
        position: relative;
        transform-style: preserve-3d;
        will-change: transform;
        transition: none;
    }
    /* 旋转结束后：缩小并淡出 */
    #dice-scene.vanish {
        transition: transform 0.4s ease, opacity 0.4s ease;
        transform: scale(0.15) !important;
        opacity: 0;
    }
    #dice-cube {
        width: 21.6px; height: 21.6px; position: relative;
        transform-style: preserve-3d;
        will-change: transform;
    }
    #dice-cube .face {
        position: absolute; width: 22.2px; height: 22.2px;
        /* 略大于理论尺寸并去掉边框，避免棱上亮线/细缝 */
        left: -0.3px; top: -0.3px;
        border-radius: 2.4px;
        border: none;
        outline: none;
        box-shadow: none;
        display: grid; place-items: center;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
    }
    /* 六面略作明暗差，旋转时能看出体积 */
    #dice-cube .f1 { background: linear-gradient(145deg, #fff8d0, #e8c44a 55%, #b8921e); }
    #dice-cube .f2 { background: linear-gradient(145deg, #f5e08a, #d4a82a 55%, #9a7210); }
    #dice-cube .f3 { background: linear-gradient(145deg, #e8d070, #c49a22 55%, #8a6410); }
    #dice-cube .f4 { background: linear-gradient(145deg, #f0dc90, #d0a828 55%, #967014); }
    #dice-cube .f5 { background: linear-gradient(160deg, #fff6c8, #f0d060 45%, #c9a227); }
    #dice-cube .f6 { background: linear-gradient(160deg, #d8b840, #a87e18 55%, #6e5010); }
    /* 光晕用 filter，不用 inset 描边（inset 容易在上沿画出一条线） */
    #dice-cube.settled {
        filter: drop-shadow(0 0 8px rgba(255, 215, 80, 0.45));
    }
    #dice-cube.settled .f1 {
        background:
            radial-gradient(circle at 30% 28%, rgba(255,255,255,0.4) 0%, transparent 24%),
            linear-gradient(145deg, #fff8d0, #e8c44a 55%, #b8921e);
    }
    #dice-cube .face::after {
        content: '✦';
        position: absolute; font-size: 3.6px; color: rgba(255,255,255,0.9);
        top: 2px; right: 3px;
        text-shadow: none;
    }
    #dice-cube.settled .face::after {
        text-shadow: 0 0 3px #fff, 0 0 5px #7dd3fc;
    }
    #dice-cube .face .pips {
        display: grid; width: 70%; height: 70%;
        grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr;
        place-items: center;
    }
    #dice-cube .face .pip {
        width: 3px; height: 3px; border-radius: 50%;
        background: #2a1206;
    }
    #dice-cube.settled .face .pip {
        background: radial-gradient(circle at 35% 35%, #5a2a0a, #1a0a02 70%);
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.25), 0 1px 1px rgba(0,0,0,0.35);
    }
    /* 六面组成封闭立方体；Z 略大于半边长，减少棱上缝线 */
    #dice-cube .f1 { transform: rotateY(0deg) translateZ(10.5px); }
    #dice-cube .f2 { transform: rotateY(90deg) translateZ(10.5px); }
    #dice-cube .f3 { transform: rotateY(180deg) translateZ(10.5px); }
    #dice-cube .f4 { transform: rotateY(-90deg) translateZ(10.5px); }
    #dice-cube .f5 { transform: rotateX(90deg) translateZ(10.5px); }
    #dice-cube .f6 { transform: rotateX(-90deg) translateZ(10.5px); }
    /* 落地阴影（挂在 scene 下，不跟着立方体翻面） */
    #dice-shadow {
        position: absolute; left: 50%; top: 50%;
        width: 24px; height: 7.2px;
        margin-left: -12px; margin-top: 13.2px;
        border-radius: 50%;

    /* 清零菜单：金色长框 + 透明底 */

    #claim-indicator .reset-btn::after {

    /* 弹窗盒：与结算页统一 */
    .hu-box {

    body.landscape-max {
        background: #05080e;
        position: fixed;
        inset: 0;
        width: var(--app-width, 100%);
        height: var(--app-height, 100%);
        max-width: 100%;
        max-height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
        touch-action: manipulation;
    }
    /* Android / Chrome：横屏全屏时用系统可用区域，兼顾手势条与挖孔 */
    html.is-android body.landscape-max,
    body.is-android.landscape-max {
        width: 100%;
        height: 100%;
        width: var(--app-width, 100%);
        height: var(--app-height, 100%);
        /* 减少 Chrome 地址栏伸缩引起的跳动 */
        min-height: var(--app-height, 100dvh);
    }
    html.is-android body.landscape-max #table-frame,
    body.is-android.landscape-max #table-frame {
        width: var(--app-width, 100%);
        height: var(--app-height, 100%);
        /* 挖孔屏横屏：安全区已在 padding；再给最小边距兜底 */
        padding-top: max(var(--sat), 0px);
        padding-bottom: max(var(--sab), 0px);
        padding-left: max(var(--sal), 4px);
        padding-right: max(var(--sar), 4px);
    }
    /* Android 横屏矮屏：再收紧控件字号，避免挡牌 */
    @media screen and (orientation: landscape) and (max-height: 420px) {
        html.is-android #wall-count-text,
        body.is-android #wall-count-text { font-size: 10px; }
        html.is-android #discard-query-btn,
        body.is-android #discard-query-btn { font-size: 9px; }
        html.is-android #view-scale-btns button,
        body.is-android #view-scale-btns button { font-size: 8px; min-width: 26px; }
    }
    body.landscape-max #table-wrap {
        width: var(--app-width, 100%);
        height: var(--app-height, 100%);
        max-width: var(--app-width, 100%);
        max-height: var(--app-height, 100%);
    }
    body.landscape-max #table-frame {
        width: var(--app-width, 100dvw);
        height: var(--app-height, 100dvh);
        max-width: none;
        max-height: none;
        border-radius: 0;
        border: 1.5px solid var(--gold);
        box-shadow: none;
    }
    body.landscape-max #game-table { border-radius: 0; }
    /* iOS 安全区：横屏铺满时避开刘海 / Home 条 */
    body.landscape-max #table-frame {
        padding-top: var(--sat);
        padding-right: var(--sar);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        box-sizing: border-box;
    }
    /* 左侧牌墙、右侧废牌区随安全区微移，避免贴边被裁 */
    body.landscape-max #wall-count {
        left: max(1.5%, var(--sal));
    }
    body.landscape-max #discard-query-btn,
    body.landscape-max #discardWall {
        right: max(1.5%, var(--sar));
    }

    body.landscape-max #wall-count {
        z-index: 20;
        pointer-events: auto;
    }
    body.landscape-max #view-scale-btns,
    body.landscape-max #discard-query-btn,
    body.landscape-max #img-display-badge,
    body.landscape-max #landscape-ctrl {
        visibility: visible !important;
        opacity: 1;
        pointer-events: auto;
    }

    /* 横屏最大化：保留牌墙/缩放/查牌池等控件，便于操作 */
    body.landscape-max #landscape-ctrl {
        opacity: 0.85;

    body.landscape-max #discard-query-btn {

    /* ========== 响应式：媒体查询 ========== */
    /* 横屏优先：矮屏 / 窄横屏 */
    @media screen and (orientation: landscape) and (max-height: 420px) {

        #flow-log { font-size: 10px; min-height: 24px; padding: 2px 6px; }
        .result-box, .hu-box { max-height: min(88vh, 360px); }
    }

    @media screen and (orientation: landscape) and (max-height: 360px) {
        #table-frame {
            width: 100vw;
            height: 100vh;
            border-radius: 0;

        .avatar img { width: 30px; height: 30px; }
        .left { left: calc(18% + 40px); top: calc(50% - 36px); }
        .right { right: calc(18% + 40px); top: calc(50% - 36px); }
        #wall-count { width: 15%; font-size: 9px; }
        #discardWall { width: 15%; }
        .bottom .hand {
            --tile-w: 26px; --tile-h: 34px; --tile-fs: 26px;
        }
        .bottom { --hand-tile-h: 34px; }
    }

    /* 宽横屏平板 */
    @media screen and (orientation: landscape) and (min-width: 900px) and (min-height: 500px) {
        #table-frame {
            width: min(94vw, 180vh);
            height: min(90vh, 48vw);
            border-radius: 20px;
        }
        .avatar img { width: 48px; height: 48px; }
        #wall-count { font-size: 12px; }
        .stat-line { font-size: 12px; }
    }

    /* 竖屏兜底：仅在尚未挂上 portrait-layout 时生效（避免与竖屏专用布局冲突） */
    @media screen and (orientation: portrait) {
        body:not(.portrait-layout) {
            padding: 4px;
        }
        body:not(.portrait-layout) #table-frame {
            width: min(96vw, 100vh);
            height: min(72vh, 140vw);
            border-radius: 16px;

        body:not(.portrait-layout) .left { left: calc(8% + 20px); top: calc(42% - 20px); }
        body:not(.portrait-layout) .right { right: calc(8% + 20px); top: calc(42% - 20px); }
        body:not(.portrait-layout) #wall-count { width: 22%; left: 1%; top: 6%; height: 70%; font-size: 10px; }
        body:not(.portrait-layout) #discardWall { width: 22%; right: 1%; top: calc(6% + 1.3em + 12.87px); height: 48%; }
        body:not(.portrait-layout) .bottom { max-width: 98%; }
    }

    /* 很窄宽度 */
    @media screen and (max-width: 520px) {

    /* 安全区（刘海 / Home 指示条）：非最大化时给 body 留白 */
    body:not(.landscape-max) {
        padding-top: var(--sat);
        padding-right: var(--sar);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        box-sizing: border-box;

    /* 弹层全屏遮罩吃到安全区外缘，内容盒再内缩 */
    #result-modal,

    #portrait-guard {

        padding-bottom: max(24px, var(--sab));
        padding-left: max(24px, var(--sal));

    @media (prefers-reduced-motion: reduce) {

    /* 竖屏引导层：仅竖屏时显示，提示用户进入横屏 */
    #portrait-guard {

    /* ========== 竖屏布局：严格按原「极简竖屏」UI，不改动原视觉 ========== */
    body.portrait-layout #table-wrap {
        transform: none !important;

    body.portrait-layout {

    <button type="button" id="discard-query-btn" title="点击查询牌池" onclick="event.stopPropagation();openPoolModal()">点击查询牌池</button>
    <div id="discardWall"></div>

<div id="wall-count">

                <span id="img-display-badge" title="TP制作">TP制作</span>

                <button type="button" id="btn-view-zoom-out" title="整体缩小5%（相对原始大小）" onclick="event.stopPropagation();adjustViewScale(-VIEW_SCALE_STEP)">缩小</button>
                <button type="button" id="btn-view-zoom-in" title="整体扩大5%（不超过原始大小）" onclick="event.stopPropagation();adjustViewScale(VIEW_SCALE_STEP)">扩大</button>
            </div>

            <div class="stat-row avatar-row" id="stat-avatar"></div>

</div>
</div>

<script>
// ---------- 基础常量与全局状态 ----------
const suits = ['万', '条', '筒'];
const honors = ['东', '南', '西', '北', '中', '发', '白'];
const PLAYERS = ['top', 'left', 'right', 'bottom'];
const turnOrder = ['bottom', 'right', 'top', 'left'];
const baseNames = { top: '西', left: '北', right: '南', bottom: '东' };
const statOrder = ['right', 'top', 'left', 'bottom'];
const statAvatar = { right: '🦁', top: '🐲', left: '🐯', bottom: '🐈' };

let deck = [];
let hands = { top: [], left: [], right: [], bottom: [] };
let exposedMelds = { top: [], left: [], right: [], bottom: [] };
let discardPile = [];
let currentIndex = 0;
let gameOver = false;
let pendingClaim = null;
let dealer = 'bottom';
let winner = null;
let selectedIndex = null;
let lastDrawnIndex = null;
let scores = { top: 0, left: 0, right: 0, bottom: 0 };
let windDragonBonus = { top: false, left: false, right: false, bottom: false };
let firstTurnPending = { top: true, left: true, right: true, bottom: true };
let lastDrawnTile = { top: null, left: null, right: null, bottom: null };
let lastDrawWasFinal = { top: false, left: false, right: false, bottom: false };
let aiWaitTiles = { top: [], left: [], right: [] };
let lastSettlement = null;

// ---------- AI 学习：跨局记忆三种性格(保守/激进/精明)的历史战绩，微调决策倾向 ----------
const AI_LEARN_KEY = 'qionghu_mahjong_ai_learn_v1';
let aiLearn = { games: 0, confidence: { conservative: 0, aggressive: 0, shrewd: 0 } };
function loadAiLearn() {
    try {
        const raw = localStorage.getItem(AI_LEARN_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.confidence) {
            aiLearn = {
                games: parsed.games || 0,
                confidence: {
                    conservative: parsed.confidence.conservative || 0,
                    aggressive: parsed.confidence.aggressive || 0,
                    shrewd: parsed.confidence.shrewd || 0
                }
            };
        }
    } catch (e) { /* 本地存储不可用则用默认值 */ }
}
function saveAiLearn() {
    try { localStorage.setItem(AI_LEARN_KEY, JSON.stringify(aiLearn)); } catch (e) {}
}
loadAiLearn();

function clampConfidence(v) { return Math.max(-3, Math.min(3, v)); }

// 一局定输赢后调用：赢家所属性格信心上升，点炮方所属性格信心下降（越玩战绩越好，AI下次就更敢按这个性格的路子来）
function learnFromWin(winnerPlayer, payerPlayer) {
    for (const p of ['top', 'left', 'right']) {
        const style = aiPersonality[p];
        if (!style) continue;
        if (p === winnerPlayer) aiLearn.confidence[style] = clampConfidence(aiLearn.confidence[style] + 0.3);
        else if (p === payerPlayer) aiLearn.confidence[style] = clampConfidence(aiLearn.confidence[style] - 0.5);
    }
    aiLearn.games += 1;
    saveAiLearn();
}
// 流局时调用：听牌的性格小幅加分，没听牌的小幅减分
function learnFromDraw(tenpaiPlayers) {
    for (const p of ['top', 'left', 'right']) {
        const style = aiPersonality[p];
        if (!style) continue;
        aiLearn.confidence[style] = clampConfidence(aiLearn.confidence[style] + (tenpaiPlayers.includes(p) ? 0.05 : -0.1));
    }
    aiLearn.games += 1;
    saveAiLearn();
}

// DOM 查询简写：全文本用 $(id) 代替 document.getElementById(id)
const $ = (id) => document.getElementById(id);

/* ==================== 函数索引（按职责分类，函数按原顺序散落在下文，此处仅作导航） ====================
 * 存档/进度：      cloneState scheduleSaveProgress flushSaveProgress saveGameProgress loadGameProgress resumeFromSave
 * 算番/胡牌判定：   hasSiGuiYi scoreWinningHand settleScore analyzeHu checkHu decompose allTileTypes
 *                  isTenpai getWinningTiles getWinningTilesOf checkWindDragonPattern
 * 骰子开局仪式：    diceEls initDicePips playDiceSound onTableTap resetDiceDom startDiceRitual
 *                  showDiceResetMenu cancelDiceRitual confirmFullReset
 * 牌堆/牌面工具：   isDangerousTile buildDeck shuffle tileSuit tileRank tileGlyph tileName tileCompare
 * 游戏流程/回合：   initGame declareDraw applyReveal offerReveal confirmReveal continueAfterFirstTurnCheck
 *                  offerSelfGangIfAny executeSelfGang nextTurn advanceTurn handleDiscard
 *                  drawReplacementAndContinue rotateDealer startGame
 * 吃碰杠/AI决策：   canPeng canGang findChiCombos protectsThreeSuits tileSeenCount isTileDead tileKeepTier
 *                  isTileDangerousFor wallUrgencyBonus chooseAiDiscardTile aiDiscard isGoingForTriplets
 *                  shouldAiPeng findAiPeng findRonPriority nextPlayerOf findAiChi aiPengClaim aiChiClaim
 *                  aiDrawReplacement resolveAiPengOrAdvance checkClaimOrAdvance acceptClaim callGang
 *                  callPeng callChi chooseChiCombo closeChiChoice executeChi declineClaim offerHu
 * 渲染/弹窗/UI：    renderTile renderExposedFace renderExposedBack renderMeldGroup render markDealer
 *                  showResultModal renderSettlementView toggleSettlementAdjust onSettlementPayoutEdit
 *                  adjustSettlementPayoutFactor applySettlementPayoutValue resetSettlementPayouts
 *                  closeResultModal showIndicator hideIndicator highlightActive syncBodyScrollLock nameOf stripEmoji speak logFlow
 * ==================================================================================================== */

// 渲染左侧空地里的状态面板：每位玩家一行，横着写 头像 风位 奖杯 庄家 听牌提示（例如 🐲 西 🏆 🎲 ⚠️）
function renderStatRow(elId, cellFor) {
    const el = $(elId);
    if (!el) return;
    el.innerHTML = statOrder.map(p => `<span class="stat-cell">${cellFor(p)}</span>`).join('');
}

function ensurePortraitStatRows() {
    const ps = $('player-stats');
    if (!ps) return;
    if ($('stat-avatar') && $('stat-wind') && $('stat-medal') && $('stat-dealer') && $('stat-tenpai')) return;
    ps.innerHTML = ''
        + '<div class="stat-row avatar-row" id="stat-avatar"></div>'
        + '<div class="stat-row" id="stat-wind"></div>'
        + '<div class="stat-row" id="stat-medal"></div>'
        + '<div class="stat-row" id="stat-dealer"></div>'
        + '<div class="stat-row" id="stat-tenpai"></div>';
}

function markDealer() {
    const maxScore = Math.max(...Object.values(scores));
    const isPortrait = document.body && document.body.classList.contains('portrait-layout');
    if (isPortrait) {
        // 竖屏：原版牌墙下五行列表（头像/风位/奖杯/庄/听）
        ensurePortraitStatRows();
        renderStatRow('stat-avatar', p => statAvatar[p]);
        renderStatRow('stat-wind', p => baseNames[p]);
        renderStatRow('stat-medal', p => (maxScore > 0 && scores[p] === maxScore) ? '🏆' : '');
        renderStatRow('stat-dealer', p => p === dealer ? '🎲' : '');
        renderStatRow('stat-tenpai', p => isTenpai(p) ? '⚠️' : '');
    } else {
        // 横屏：侧栏每人一行
        const ps = $('player-stats');
        if (ps) {
            ps.innerHTML = statOrder.map(p => {
                const medal = (maxScore > 0 && scores[p] === maxScore) ? ' 🏆' : '';
                const dealerMark = p === dealer ? ' 🎲' : '';
                const tenpaiMark = isTenpai(p) ? ' ⚠️' : '';
                return `<div class="stat-line">${statAvatar[p]} ${baseNames[p]}${medal}${dealerMark}${tenpaiMark}</div>`;
            }).join('');
        }
    }
    for (const p of PLAYERS) {
        const s = scores[p];
        const el = $('score-' + p);
        if (el) el.innerText = (s >= 0 ? '+' : '') + s;
    }
    scheduleSaveProgress();
}

// 完整对局记忆（积分/庄家/牌面/轮次）→ localStorage，刷新后原样恢复
const MAHJONG_STORAGE_KEY = 'qionghu_mahjong_progress_v2';
let restoringGame = false;
let saveProgressTimer = 0;

function cloneState(obj) {
    return JSON.parse(JSON.stringify(obj));
}

/** 防抖写盘：避免每次 render 都同步 stringify 造成卡顿 */
function scheduleSaveProgress() {
    if (restoringGame) return;
    if (saveProgressTimer) clearTimeout(saveProgressTimer);
    saveProgressTimer = setTimeout(() => {
        saveProgressTimer = 0;
        saveGameProgress();
    }, 280);
}

/** 立刻落盘（取消未执行的防抖），用于关键节点与页面关闭前 */
function flushSaveProgress() {
    if (restoringGame) return;
    if (saveProgressTimer) {
        clearTimeout(saveProgressTimer);
        saveProgressTimer = 0;
    }
    saveGameProgress();
}

function saveGameProgress() {
    if (restoringGame) return;
    try {
        localStorage.setItem(MAHJONG_STORAGE_KEY, JSON.stringify({
            v: 2,
            scores, dealer, currentIndex, gameOver, winner,
            selectedIndex, lastDrawnIndex,
            deck: cloneState(deck),
            hands: cloneState(hands),
            exposedMelds: cloneState(exposedMelds),
            discardPile: cloneState(discardPile),
            windDragonBonus: cloneState(windDragonBonus),
            firstTurnPending: cloneState(firstTurnPending),
            lastDrawnTile: cloneState(lastDrawnTile),
            lastDrawWasFinal: cloneState(lastDrawWasFinal),
            aiWaitTiles: cloneState(aiWaitTiles),
            // 仅持久化「下一局」；进行中吃碰杠刷新后由玩家重选，避免半自动卡死
            pendingClaimMode: pendingClaim && pendingClaim.mode === 'nextGame' ? 'nextGame' : null
        }));
    } catch (e) { /* 隐私模式等不可用时忽略 */ }
}

// 刷新/切后台前强制写入，避免 280ms 防抖窗口内丢进度
window.addEventListener('pagehide', flushSaveProgress);
/* resize / orientationchange → bindOrientationListeners → handleOrientationEvent（内含 fitBottomHand） */
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushSaveProgress();
});

function loadGameProgress() {
    try {
        // 兼容旧版仅存 scores+dealer 的存档
        let raw = localStorage.getItem(MAHJONG_STORAGE_KEY);
        if (!raw) {
            const legacy = localStorage.getItem('qionghu_mahjong_progress_v1');
            if (legacy) {
                const old = JSON.parse(legacy);
                if (old && old.scores) {
                    for (const p of PLAYERS) {
                        if (typeof old.scores[p] === 'number') scores[p] = old.scores[p];
                    }
                }
                if (old && PLAYERS.includes(old.dealer)) {
                    dealer = old.dealer;
                }
            }
            return false; // 无完整对局，走 initGame
        }
        const saved = JSON.parse(raw);
        if (!saved || typeof saved !== 'object') return false;

        // 始终恢复跨局指标
        if (saved.scores) {
            for (const p of PLAYERS) {
                if (typeof saved.scores[p] === 'number') scores[p] = saved.scores[p];
            }
        }
        if (PLAYERS.includes(saved.dealer)) {
            dealer = saved.dealer;
        }

        // 完整对局快照（v2）才恢复牌面
        if (saved.v !== 2 || !Array.isArray(saved.deck) || !saved.hands) return false;

        restoringGame = true;
        deck = saved.deck;
        hands = saved.hands;
        exposedMelds = saved.exposedMelds || { top: [], left: [], right: [], bottom: [] };
        discardPile = saved.discardPile || [];
        currentIndex = typeof saved.currentIndex === 'number' ? saved.currentIndex : turnOrder.indexOf(dealer);
        gameOver = !!saved.gameOver;
        winner = saved.winner || null;
        windDragonBonus = saved.windDragonBonus || { top: false, left: false, right: false, bottom: false };
        firstTurnPending = saved.firstTurnPending || { top: false, left: false, right: false, bottom: false };
        lastDrawnTile = saved.lastDrawnTile || { top: null, left: null, right: null, bottom: null };
        lastDrawWasFinal = saved.lastDrawWasFinal || { top: false, left: false, right: false, bottom: false };
        aiWaitTiles = saved.aiWaitTiles || { top: [], left: [], right: [] };
        selectedIndex = saved.selectedIndex ?? null;
        lastDrawnIndex = saved.lastDrawnIndex ?? null;
        pendingClaim = saved.pendingClaimMode === 'nextGame' ? { mode: 'nextGame' } : null;
        restoringGame = false;
        return true;
    } catch (e) {
        restoringGame = false;
        return false; /* 存档损坏时忽略，从当前默认状态开始 */
    }
}

// 从存档恢复后：重绘桌面，若轮到 AI 且局未结束则继续其出牌
function resumeFromSave() {
    render();
    const player = turnOrder[currentIndex];
    highlightActive(player);
    if (gameOver) {
        // 结算弹窗无法原样恢复：统一给出「开下一局」入口（庄家轮转仍按 winner 计算）
        pendingClaim = { mode: 'nextGame' };
        showIndicator('🔔 下一局', true);
        logFlow((winner ? (nameOf(winner) + ' 胡了。') : '流局。') + '点✅开下一局（积分与庄家已保留）');
        return;
    }
    if (player === 'bottom') {
        logFlow('轮到你，请点击一张牌出牌');
        offerSelfGangIfAny();
    } else {
        logFlow('继续对局…');
        setTimeout(() => {
            const needDiscard = hands[player].length % 3 === 2;
            if (needDiscard) aiDiscard(player);
            else nextTurn();
        }, 600);
    }
}

const windTilesArr = ['1字', '2字', '3字', '4字'];
const dragonTilesArr = ['5字', '6字', '7字'];

// 四归一：某张牌凑齐4张，3张做刻子(或杠)、剩下1张落在一个顺子里
function hasSiGuiYi(decomp, exposed) {
    const tripletCount = {}, sequenceCount = {};
    decomp.forEach(m => {
        const target = m.type === 'triplet' ? tripletCount : (m.type === 'sequence' ? sequenceCount : null);
        if (target) m.tiles.forEach(t => { target[t] = (target[t] || 0) + 1; });
    });
    exposed.forEach(m => {
        if (m.type === 'peng' || m.type === 'gang') {
            const t = m.tiles[0];
            tripletCount[t] = (tripletCount[t] || 0) + 3; // 杠的第4张是"补的"，不算进四归一的顺子那一份
        }
        if (m.type === 'chi') m.tiles.forEach(t => { sequenceCount[t] = (sequenceCount[t] || 0) + 1; });
    });
    for (const t in tripletCount) {
        if (tripletCount[t] >= 3 && sequenceCount[t] >= 1) return true;
    }
    return false;
}

// 分析这次胡牌的番型倍数：底分2分，以下每项都翻倍且可叠加：
// 杠(每个×2，可多次) / 中发白刻子(不管暗刻明刻) / 东南西北亮牌明组 / 单吊 / 边张 / 夹张 / 自摸 / 海底捞
// 碰碰胡(全部刻子/杠，无顺子)例外：翻8倍代替翻2倍，但仍可与其他项叠加
// concealedBeforeWin: 胡牌前的暗牌(不含winTile)；winTile: 刚好胡的这张
// 在所有能胡的分解方式里取倍数最高的一种（对玩家最有利）
/** 计算和牌番型倍数（不含自摸/点炮/庄家，那些在 settleScore） */
function scoreWinningHand(concealedBeforeWin, winTile, exposed, isSelfDraw, isLastTile) {
    const concealed = [...concealedBeforeWin, winTile].sort(tileCompare);
    const neededSets = 4 - exposed.length;
    let best = { mult: 1, tags: [] };
    const counts = {};
    for (const t of concealed) counts[t] = (counts[t] || 0) + 1;

    for (const pairTile of Object.keys(counts)) {
        if (counts[pairTile] < 2) continue;
        const rest = [];
        let skipped = 0;
        for (const t of concealed) {
            if (t === pairTile && skipped < 2) { skipped++; continue; }
            rest.push(t);
        }
        const decompositions = decompose(rest);
        for (const decomp of decompositions) {
            if (decomp.length !== neededSets) continue;

            // winTile在这套分解里落在哪：单吊(对子) / 边张 / 夹张 / 普通
            let waitType = 'normal';
            if (pairTile === winTile) {
                waitType = 'tanki';
            } else {
                for (const m of decomp) {
                    if (m.type === 'sequence' && m.tiles.includes(winTile)) {
                        const ranks = m.tiles.map(tileRank);
                        if (winTile === m.tiles[1]) waitType = 'kanchan'; // 中间那张：夹张
                        else if (winTile === m.tiles[0] && ranks[2] === 9) waitType = 'bianzhang'; // 7,8,9缺7
                        else if (winTile === m.tiles[2] && ranks[0] === 1) waitType = 'bianzhang'; // 1,2,3缺3
                        break;
                    }
                }
            }

            const isAllTriplets = decomp.every(m => m.type === 'triplet') &&
                exposed.every(m => m.type === 'peng' || m.type === 'gang');
            const hasDragonTriplet =
                decomp.some(m => m.type === 'triplet' && dragonTilesArr.includes(m.tiles[0])) ||
                exposed.some(m => (m.type === 'peng' || m.type === 'gang') && dragonTilesArr.includes(m.tiles[0])) ||
                exposed.some(m => m.type === 'dragons');
            const siGuiYi = hasSiGuiYi(decomp, exposed);

            let mult = 1;
            const tags = [];
            if (isAllTriplets) { mult *= 8; tags.push('碰碰胡×8'); }
            if (hasDragonTriplet) { mult *= 2; tags.push('中发白×2'); }
            // 风刻明组：×1，不再加倍（保留判断但不影响总分）
            if (waitType === 'tanki') { mult *= 2; tags.push('单吊×2'); }
            if (waitType === 'bianzhang') { mult *= 2; tags.push('边张×2'); }
            if (waitType === 'kanchan') { mult *= 2; tags.push('夹张×2'); }
            if (isLastTile) { mult *= 2; tags.push('海底捞×2'); }
            if (siGuiYi) { mult *= 2; tags.push('四归一×2'); }
            for (const m of exposed) {
                if (m.type !== 'gang') continue;
                if (m.concealed) { mult *= 4; tags.push('暗杠×4'); }
                else { mult *= 2; tags.push('明杠×2'); }
            }

            if (mult > best.mult) best = { mult, tags };
        }
    }
    return best;
}

// 结算一局的分数：底分2分 x 番型倍数(含自摸/点炮/庄家/庄点炮)，庄家赢/输都再翻倍
// 返回 { detail(文字摘要), payouts(每家+/-), total(赢家总所得), tags(完整标签列表), dealerWinBonus }
function settleScore(winner, mode, payer, bonus) {
    const tags = [...bonus.tags];
    let mult = bonus.mult;
    if (mode === 'selfdraw') { mult *= 2; tags.push('自摸×2'); }
    else {
        mult *= 2; tags.push('点炮×2');
        if (!isKaimen(exposedMelds[winner])) { mult *= 2; tags.push('没开门点炮×2'); }
    }
    const dealerWinBonus = winner === dealer;
    if (dealerWinBonus) { mult *= 2; tags.push('庄家×2'); }
    const dealerPayBonus = mode === 'dianpao' && payer === dealer;
    if (dealerPayBonus) { mult *= 2; tags.push('庄点炮×2'); }

    const baseScore = mode === 'selfdraw' ? 1 : 2; // 自摸底分1，点炮底分2
    let unit = baseScore * mult;
    const tagText = tags.length ? '(' + tags.join('+') + ')' : '';
    const payouts = { top: 0, left: 0, right: 0, bottom: 0 };
    let detail, total;
    if (mode === 'selfdraw') {
        total = 0;
        for (const p of turnOrder) {
            if (p === winner) continue;
            let pay = unit;
            if (p === dealer) pay *= 2; // 自摸时，庄家作为付款方单独再翻倍(只影响这一位的具体金额，不重复计入上面的倍数说明)
            scores[p] -= pay;
            payouts[p] = -pay;
            total += pay;
        }
        scores[winner] += total;
        payouts[winner] = total;
        detail = '自摸' + tagText + '，合计 ' + total + ' 分';
    } else {
        let pay = unit; // 点炮只出自己这一份，不用把另外两家的份额也包了
        scores[payer] -= pay;
        scores[winner] += pay;
        payouts[payer] = -pay;
        payouts[winner] = pay;
        total = pay;
        detail = nameOf(payer) + ' 点炮' + tagText + '，付 ' + pay + ' 分';
    }
    return { detail, payouts, total, tags, dealerWinBonus };
}

// 判断某玩家是否听牌：暗牌数刚好比“完整手牌”少一张，且存在某张牌补上就能胡
// 所有可能的牌种：万条筒1-9 + 字牌1-7
function allTileTypes() {
    const types = [];
    for (const s of suits) for (let r = 1; r <= 9; r++) types.push(r + s);
    for (let r = 1; r <= honors.length; r++) types.push(r + '字');
    return types;
}

function isTenpai(player) {
    return getWinningTiles(player).length > 0;
}

// 某玩家当前听哪些牌（不听返回空数组）
function getWinningTiles(player) {
    return getWinningTilesOf(hands[player], exposedMelds[player], player);
}

// ========== 三击桌面：黄金骰子仪式（清零 / 继续） ==========
// 流程：连点空白处 3 次 → 3D 旋转 2s → 缩小消失 → 弹出清零菜单

/** 合成一串撞击噪声 + 落地低音 */
function playDiceSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        for (let i = 0; i < 8; i++) {
            const t0 = now + i * 0.07;
            const dur = 0.04 + Math.random() * 0.03;
            const n = Math.floor(ctx.sampleRate * dur);
            const buf = ctx.createBuffer(1, n, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let j = 0; j < n; j++) data[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / n, 2);
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const filt = ctx.createBiquadFilter();
            filt.type = 'bandpass';
            filt.frequency.value = 800 + Math.random() * 1800;
            filt.Q.value = 1.2;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.35 * (1 - i * 0.04), t0);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            src.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
            src.start(t0); src.stop(t0 + dur + 0.01);
        }
        const tEnd = now + 0.58;
        const osc = ctx.createOscillator();
        const g2 = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, tEnd);
        osc.frequency.exponentialRampToValueAtTime(60, tEnd + 0.12);
        g2.gain.setValueAtTime(0.22, tEnd);
        g2.gain.exponentialRampToValueAtTime(0.001, tEnd + 0.14);
        osc.connect(g2); g2.connect(ctx.destination);
        osc.start(tEnd); osc.stop(tEnd + 0.15);
        setTimeout(() => { try { ctx.close(); } catch (e) {} }, 1200);
    } catch (e) { /* 无音频权限时静默 */ }
}

/** 桌面单击：仅空白处计入，450ms 内满 3 次触发仪式 */

/** 横屏最大化：全屏 + 尽量锁定横屏（部分浏览器需用户手势） */

/** 桌面可视缩放：1 = 最大；每次 ±5%，下限 0.5 */
/** 原始正常大小（启动时锁定，扩大不能超过它） */
const ORIGINAL_VIEW_SCALE = 1;
const VIEW_SCALE_MIN = 0.7; /* 最多缩到原始的 70% */
const VIEW_SCALE_MAX = ORIGINAL_VIEW_SCALE;
const VIEW_SCALE_STEP = 0.05;
const VIEW_SCALE_STORAGE_KEY = 'qionghu_mahjong_view_scale_v1';
const VIEW_ORIGINAL_STORAGE_KEY = 'qionghu_mahjong_view_original_v1';

let viewScale = ORIGINAL_VIEW_SCALE;
/** 启动时记录的桌面原始像素尺寸（供对照/恢复） */
let originalViewRecord = null;

function captureOriginalViewSize() {
    if (originalViewRecord) return originalViewRecord;
    const frame = document.getElementById('table-frame');
    const wrap = document.getElementById('table-wrap');
    let w = 0, h = 0;
    if (frame) {
        const r = frame.getBoundingClientRect();
        // 若当前已缩放，反推未缩放尺寸
        const s = viewScale || 1;
        w = r.width / s;
        h = r.height / s;
    }
    originalViewRecord = {
        scale: ORIGINAL_VIEW_SCALE,
        width: Math.round(w * 10) / 10,
        height: Math.round(h * 10) / 10,
        capturedAt: Date.now()
    };
    try {
        localStorage.setItem(VIEW_ORIGINAL_STORAGE_KEY, JSON.stringify(originalViewRecord));
    } catch (e) { /* ignore */ }
    return originalViewRecord;
}

function loadSavedViewScale() {
    try {
        const raw = localStorage.getItem(VIEW_SCALE_STORAGE_KEY);
        if (raw == null) return ORIGINAL_VIEW_SCALE;
        const n = parseFloat(raw);
        if (!isFinite(n)) return ORIGINAL_VIEW_SCALE;
        return Math.max(VIEW_SCALE_MIN, Math.min(VIEW_SCALE_MAX, n));
    } catch (e) {
        return ORIGINAL_VIEW_SCALE;
    }
}

function applyViewScale() {
    viewScale = Math.round(viewScale * 1000) / 1000;
    if (viewScale > VIEW_SCALE_MAX) viewScale = VIEW_SCALE_MAX;
    if (viewScale < VIEW_SCALE_MIN) viewScale = VIEW_SCALE_MIN;
    document.documentElement.style.setProperty('--view-scale', String(viewScale));
    try {
        localStorage.setItem(VIEW_SCALE_STORAGE_KEY, String(viewScale));
    } catch (e) { /* ignore */ }
    const btnIn = document.getElementById('btn-view-zoom-in');
    const btnOut = document.getElementById('btn-view-zoom-out');
    if (btnIn) btnIn.disabled = viewScale >= VIEW_SCALE_MAX - 1e-9;
    if (btnOut) btnOut.disabled = viewScale <= VIEW_SCALE_MIN + 1e-9;
    // 兜底：部分安卓 WebView 在缩放瞬间会出现"金边框已更新、内部圆角裁剪内容未同步重绘"
    // 的错位现象，这里强制触发一次重排+重绘，确保边框与桌面内容一起刷新
    const frameEl = document.getElementById('table-frame');
    const wrapEl = document.getElementById('table-wrap');
    if (frameEl) {
        void frameEl.offsetHeight; // 强制同步重排
    }
    requestAnimationFrame(() => {
        // 下一帧再强制读取一次布局尺寸，确保边框与内部内容按同一次合成结果绘制
        if (wrapEl) void wrapEl.offsetHeight;
        if (frameEl) void frameEl.offsetHeight;
    });
    setTimeout(fitBottomHand, 120);
}

/** delta: +0.05 扩大 / -0.05 缩小；相对「原始正常大小」等比缩放 */
function adjustViewScale(delta) {
    if (!originalViewRecord) captureOriginalViewSize();
    // 已达原始最大尺寸时，扩大无效
    if (delta > 0 && viewScale >= VIEW_SCALE_MAX - 1e-9) {
        logFlow('已是原始正常大小，无法再扩大');
        applyViewScale();
        return;
    }
    if (delta < 0 && viewScale <= VIEW_SCALE_MIN + 1e-9) {
        logFlow('已缩小到原始大小的 80%，无法再缩');
        applyViewScale();
        return;
    }
    viewScale = viewScale + delta;
    applyViewScale();
    const pct = Math.round(viewScale * 100);
    if (Math.abs(viewScale - ORIGINAL_VIEW_SCALE) < 1e-9) {
        logFlow('已恢复原始正常大小（100%）');
    } else if (delta < 0) {
        logFlow('整体（含头像）缩小至 ' + pct + '%（原始=100%）');
    } else {
        logFlow('整体（含头像）扩大至 ' + pct + '%（原始=100%）');
    }
}

async function toggleLandscapeMaximize() {
    // 横屏调整 = 恢复原始正常大小 + 尽量全屏横屏
    if (!originalViewRecord) captureOriginalViewSize();
    viewScale = ORIGINAL_VIEW_SCALE;
    applyViewScale();
    applyDevicePlatformClass();
    const body = document.body;
    const ios = isIOSDevice();
    const android = isAndroidDevice();
    let fsOk = false;
    try {
        if (!ios) {
            // Android / 桌面 Chrome：Fullscreen + 锁定横屏（用户手势内调用）
            const el = document.documentElement;
            const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
            if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
                try {
                    // navigationUI: 'hide' 在 Chrome Android 可尽量隐藏系统栏
                    await req.call(el, { navigationUI: 'hide' });
                    fsOk = true;
                } catch (e) {
                    try { await req.call(el); fsOk = true; } catch (e2) {}
                }
            } else if (document.fullscreenElement || document.webkitFullscreenElement) {
                fsOk = true;
            }
            try {
                if (screen.orientation && screen.orientation.lock) {
                    // Android Chrome 支持在全屏后 lock
                    await screen.orientation.lock('landscape').catch(() =>
                        screen.orientation.lock('landscape-primary').catch(() => {})
                    );
                }
            } catch (e) {}
            if (android && !fsOk) {
                // 未进全屏时：滚动收起 Chrome 工具栏
                try { window.scrollTo(0, 1); } catch (e) {}
            }
        } else {
            try { window.scrollTo(0, 1); } catch (e) {}
        }
        body.classList.add('landscape-max');
        syncAppViewportVars();
        if (ios) {
            logFlow(isPortraitOrientation()
                ? '请横向持机；可在设置中关闭竖屏锁定'
                : '已横屏铺满（iOS 可将网页「添加到主屏幕」以隐藏地址栏）');
        } else if (android) {
            logFlow(fsOk
                ? '已全屏横屏（Android）'
                : '已横屏铺满；可再点一次尝试全屏，或「添加到主屏幕」');
        } else {
            logFlow(fsOk ? '已最大化' : '已最大化（可尝试全屏或添加到主屏幕）');
        }
    } catch (e) {
        body.classList.add('landscape-max');
        syncAppViewportVars();
        logFlow('已最大化');
    }
    if (!fsOk) {
        [60, 200, 400, 800, 1200].forEach(ms => {
            setTimeout(() => {
                try { window.scrollTo(0, 1); } catch (e) {}
                syncAppViewportVars();
                fitBottomHand();
            }, ms);
        });
    } else if (android) {
        // 全屏成功后仍同步几次，适配系统栏动画
        [100, 300, 600].forEach(ms => {
            setTimeout(() => { syncAppViewportVars(); fitBottomHand(); }, ms);
        });
    }
    setTimeout(fitBottomHand, 180);
    setTimeout(fitBottomHand, 450);
}
document.addEventListener('fullscreenchange', () => {
    syncAppViewportVars();
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        // 仅退出全屏时不必强制退出横屏铺满（用户可能仍横持）
        setTimeout(() => {
            syncAppViewportVars();
            fitBottomHand();
            schedulePortraitGuardChecks();
        }, 120);
    } else {
        document.body.classList.add('landscape-max');
        setTimeout(() => { syncAppViewportVars(); fitBottomHand(); }, 100);
    }
});
document.addEventListener('webkitfullscreenchange', () => {
    syncAppViewportVars();
    schedulePortraitGuardChecks();
});
/** 竖屏引导层：竖屏时显示提示 + 一键进入横屏；横屏时自动隐藏，不做其它处理 */
/** iOS / Android 检测 */
function isIOSDevice() {
    const ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isAndroidDevice() {
    const ua = navigator.userAgent || '';
    return /Android/i.test(ua);
}
/** Pixel / 其它 Google 系机型（含 GSI 特征时的辅助识别） */
function isGoogleAndroidDevice() {
    if (!isAndroidDevice()) return false;
    const ua = navigator.userAgent || '';
    // Pixel 常见 UA 含 "Pixel"；部分 ChromeOS 平板不含 Android
    return /Pixel/i.test(ua) || /Nexus/i.test(ua);
}
function applyDevicePlatformClass() {
    const root = document.documentElement;
    const body = document.body;
    if (!root || !body) return;
    const android = isAndroidDevice();
    const ios = isIOSDevice();
    root.classList.toggle('is-android', android);
    root.classList.toggle('is-ios', ios);
    root.classList.toggle('is-google-android', isGoogleAndroidDevice());
    body.classList.toggle('is-android', android);
    body.classList.toggle('is-ios', ios);
    body.classList.toggle('is-google-android', isGoogleAndroidDevice());
}

/** 同步真实可视区域到 CSS 变量（iOS 地址栏 + Android Chrome 底栏/手势条） */
function syncAppViewportVars() {
    let w = window.innerWidth || document.documentElement.clientWidth || 0;
    let h = window.innerHeight || document.documentElement.clientHeight || 0;
    try {
        if (window.visualViewport) {
            w = Math.round(window.visualViewport.width) || w;
            h = Math.round(window.visualViewport.height) || h;
        }
    } catch (e) { /* ignore */ }
    // Android：全屏后优先用 layout 视口，避免 visualViewport 被工具栏短暂缩小
    try {
        if (isAndroidDevice() && (document.fullscreenElement || document.webkitFullscreenElement)) {
            w = window.innerWidth || w;
            h = window.innerHeight || h;
        }
    } catch (e) { /* ignore */ }
    if (w > 0) document.documentElement.style.setProperty('--app-width', w + 'px');
    if (h > 0) document.documentElement.style.setProperty('--app-height', h + 'px');
    return { w, h };
}

/** 读取当前可视宽高（优先 visualViewport） */
function getViewportSize() {
    let w = window.innerWidth || document.documentElement.clientWidth || 0;
    let h = window.innerHeight || document.documentElement.clientHeight || 0;
    try {
        if (window.visualViewport) {
            w = Math.round(window.visualViewport.width) || w;
            h = Math.round(window.visualViewport.height) || h;
        }
    } catch (e) { /* ignore */ }
    // Android 旋转动画中 inner 可能短暂不准：若与 screen 方向明显相反，采信 screen
    try {
        if (isAndroidDevice() && screen && screen.width && screen.height) {
            const sw = screen.width, sh = screen.height;
            const innerLand = w >= h;
            const screenLand = sw >= sh;
            // 仅在差异很大时校正，避免误伤分屏
            if (innerLand !== screenLand && Math.max(w, h) / Math.max(1, Math.min(w, h)) < 1.15) {
                const a = Math.max(w, h), b = Math.min(w, h);
                if (screenLand) { w = a; h = b; }
                else { w = b; h = a; }
            }
        }
    } catch (e) { /* ignore */ }
    return { w, h };
}

/**
 * 综合判断是否竖屏
 * iOS Safari 旋转瞬间 orientation / matchMedia / 宽高可能短暂不一致：
 * 以「宽高比」为主信号，其它 API 作辅助；明显横宽时强制横屏。
 */
function isPortraitOrientation() {
    const { w, h } = getViewportSize();
    // 主信号：宽高（旋转完成后最可靠）
    if (w > 0 && h > 0) {
        // 明显横屏
        if (w > h * 1.05) return false;
        // 明显竖屏
        if (h > w * 1.05) return true;
    }
    // 接近方形时再用系统 API
    try {
        if (typeof window.orientation === 'number') {
            const o = window.orientation;
            if (o === 90 || o === -90) return false;
            if (o === 0 || o === 180) return true;
        }
    } catch (e) { /* ignore */ }
    try {
        if (screen.orientation && typeof screen.orientation.type === 'string') {
            const t = screen.orientation.type;
            if (t.indexOf('landscape') === 0) return false;
            if (t.indexOf('portrait') === 0) return true;
        }
    } catch (e) { /* ignore */ }
    try {
        if (window.matchMedia('(orientation: landscape)').matches) return false;
        if (window.matchMedia('(orientation: portrait)').matches) return true;
    } catch (e) { /* ignore */ }
    if (!w || !h) return false;
    return h >= w;
}

function placeClaimIndicatorForOrientation(isPortrait) {
    const el = $('claim-indicator');
    if (!el) return;
    if (isPortrait) {
        const table = $('game-table');
        if (table && el.parentElement !== table) table.appendChild(el);
    } else {
        const wall = $('wall-count');
        if (wall && el.parentElement !== wall) wall.appendChild(el);
    }
}

function checkPortraitGuard() {
    syncAppViewportVars();
    const isPortrait = isPortraitOrientation();
    const body = document.body;
    if (!body) return;
    const wasPortrait = body.classList.contains('portrait-layout');
    // 双布局：竖屏用 portrait-layout，横屏用默认横屏样式；不再强制拦截
    body.classList.toggle('portrait-layout', !!isPortrait);
    body.classList.remove('show-portrait-guard');
    placeClaimIndicatorForOrientation(!!isPortrait);
    // 方向切换时刷新牌墙下列表（竖屏五行 / 横屏侧栏）
    if (wasPortrait !== !!isPortrait) {
        try { hideExposedInfo(); } catch (e) {}
        try { markDealer(); } catch (e) {}
        try { render(); } catch (e) {}
    }
    setTimeout(fitBottomHand, 60);
    if (isPortrait) setTimeout(fitBottomHand, 200);
}

/** 旋转/尺寸变化后多次复核（iOS 地址栏收起与旋转动画期间尺寸会变） */
/** 旋转处理状态（Android Chrome 会连续触发 orientation + resize） */
let _orientationHandling = false;
let _lastOrientationKey = '';
let _orientationTimers = [];

function clearOrientationTimers() {
    _orientationTimers.forEach(id => clearTimeout(id));
    _orientationTimers = [];
}

function getOrientationKey() {
    const { w, h } = getViewportSize();
    let type = '';
    try {
        if (screen.orientation && screen.orientation.type) type = screen.orientation.type;
    } catch (e) {}
    try {
        if (!type && typeof window.orientation === 'number') type = String(window.orientation);
    } catch (e) {}
    return type + '|' + (w > h ? 'L' : 'P') + '|' + w + 'x' + h;
}

/**
 * 统一响应屏幕旋转 / 视口变化
 * Android：orientationchange 时宽高常未更新，需等 resize / visualViewport；
 * 并做防抖，避免一次旋转触发十几次重排。
 */
function handleOrientationEvent(source) {
    const key = getOrientationKey();
    // 同一稳定状态不重复打满定时器（resize 噪声多）
    if (source === 'resize' && key === _lastOrientationKey && !_orientationHandling) {
        syncAppViewportVars();
        return;
    }
    _orientationHandling = true;
    syncAppViewportVars();
    checkPortraitGuard();
    try { fitBottomHand(); } catch (e) {}

    clearOrientationTimers();
    const delays = isAndroidDevice()
        ? [0, 50, 100, 150, 250, 400, 600, 900, 1200, 1600]
        : [0, 50, 120, 250, 400, 700, 1100];
    delays.forEach(ms => {
        const id = setTimeout(() => {
            syncAppViewportVars();
            checkPortraitGuard();
            try { fitBottomHand(); } catch (e) {}
            const nowKey = getOrientationKey();
            if (ms >= delays[delays.length - 1] - 50) {
                _lastOrientationKey = nowKey;
                _orientationHandling = false;
            }
        }, ms);
        _orientationTimers.push(id);
    });
}

function schedulePortraitGuardChecks() {
    handleOrientationEvent('manual');
}

async function enterLandscapeFromGuard() {
    // Android 可尝试 lock；iOS 通常失败，忽略即可
    try {
        if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape').catch(() =>
                screen.orientation.lock('landscape-primary').catch(() => {})
            );
        }
    } catch (e) { /* ignore */ }
    try {
        window.scrollTo(0, 1);
        setTimeout(() => { try { window.scrollTo(0, 0); } catch (e2) {} }, 50);
    } catch (e) {}
    await toggleLandscapeMaximize();
    handleOrientationEvent('enter-landscape');
    setTimeout(() => {
        if (isPortraitOrientation()) {
            logFlow(isAndroidDevice()
                ? '请关闭竖屏锁定后横持手机（Android）'
                : '请将手机横过来；iOS 需关闭竖屏锁定后旋转');
        }
    }, 400);
}

/** —— 屏幕旋转 / 视口事件绑定 —— */
function bindOrientationListeners() {
    // 1) 传统 orientationchange（部分 Android WebView 仍依赖）
    window.addEventListener('orientationchange', () => {
        handleOrientationEvent('orientationchange');
    }, { passive: true });

    // 2) Screen Orientation API（Chrome Android 推荐）
    try {
        if (screen.orientation && screen.orientation.addEventListener) {
            screen.orientation.addEventListener('change', () => {
                handleOrientationEvent('screen.orientation');
            });
        }
    } catch (e) { /* ignore */ }

    // 3) matchMedia 横竖屏切换（不依赖 orientation 事件，兼容性好）
    try {
        const mql = window.matchMedia('(orientation: landscape)');
        const onMql = () => handleOrientationEvent('matchMedia');
        if (mql.addEventListener) mql.addEventListener('change', onMql);
        else if (mql.addListener) mql.addListener(onMql); // 旧 Android WebView
    } catch (e) { /* ignore */ }

    // 4) resize：旋转后尺寸落稳的主信号（防抖在 handle 内）
    window.addEventListener('resize', () => {
        handleOrientationEvent('resize');
    }, { passive: true });

    // 5) visualViewport：Chrome 工具栏伸缩 / 旋转后的真实可见区域
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            handleOrientationEvent('visualViewport');
        }, { passive: true });
        window.visualViewport.addEventListener('scroll', () => {
            // 仅同步 CSS 变量，不做全量旋转流程，减少抖动
            syncAppViewportVars();
        }, { passive: true });
    }

    // 6) 回前台 / bfcache 恢复后再测一次（Android 多任务切换常见）
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            handleOrientationEvent('visibility');
        }
    });
    window.addEventListener('pageshow', () => {
        handleOrientationEvent('pageshow');
    });

    document.addEventListener('DOMContentLoaded', () => {
        applyDevicePlatformClass();
        handleOrientationEvent('DOMContentLoaded');
    });

function onTableTap(e) {
    if (diceBusy) return;

/** 重置骰子 DOM 状态（隐藏、清除动画类与内联 transform） */
function resetDiceDom() {
    const { stage, scene, cube, shadow } = diceEls();
    if (diceRafId) { cancelAnimationFrame(diceRafId); diceRafId = 0; }
    if (diceVanishTimer) { clearTimeout(diceVanishTimer); diceVanishTimer = 0; }
    stage.classList.remove('show', 'fade-out');
    scene.classList.remove('vanish');
    scene.style.transform = '';
    scene.style.opacity = '';
    cube.classList.remove('settled');
    cube.style.transform = '';
    if (shadow) {
        shadow.style.transform = 'translateZ(-30px) scale(1)';
        shadow.style.opacity = '0.6';
    }
}

function startDiceRitual() {
    if (diceBusy) return;
    diceBusy = true;
    diceSavedClaim = pendingClaim;
    pendingClaim = { mode: 'diceMenu' };
    hideIndicator();
    resetDiceDom();

    const { stage, scene, cube, shadow } = diceEls();
    stage.classList.add('show');
    playDiceSound();

    const face = 1 + Math.floor(Math.random() * 6);
    const end = DICE.FACE_ROT[face];
    const spinsX = (4 + Math.floor(Math.random() * 5)) * 360;
    const spinsY = (6 + Math.floor(Math.random() * 7)) * 360;
    const spinsZ = (2 + Math.floor(Math.random() * 3)) * 360;
    const phase = Math.random() * Math.PI * 2;
    const t0 = performance.now();

    function tick(now) {
        const t = Math.min(1, (now - t0) / DICE.ROLL_MS);
        const ease = 1 - Math.pow(1 - t, 3); // ease-out
        const inv = 1 - ease;
        const lift = Math.sin(Math.PI * t);   // 0→1→0 抛起
        const toss = lift * 54;
        const scale = 1 + lift * 0.22;
        const wobble = inv * 22 * Math.sin((now - t0) * 0.022 + phase);
        const rx = spinsX * inv + end.x * ease + wobble;
        const ry = spinsY * inv + end.y * ease + wobble * 0.65;
        const rz = spinsZ * inv + wobble * 0.4;

        scene.style.transform = `translateY(${-toss}px) scale(${scale})`;
        cube.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
        if (shadow) {
            shadow.style.transform = `translateZ(-30px) scale(${1 - lift * 0.45})`;
            shadow.style.opacity = String(0.25 + 0.4 * (1 - lift));
        }

        if (t < 1) {
            diceRafId = requestAnimationFrame(tick);
            return;
        }
        // 落地定格 → 缩小消失 → 菜单
        diceRafId = 0;
        scene.style.transform = 'translateY(0) scale(1)';
        cube.style.transform = `rotateX(${end.x}deg) rotateY(${end.y}deg) rotateZ(0deg)`;
        cube.classList.add('settled');
        if (shadow) {
            shadow.style.transform = 'translateZ(-30px) scale(1)';
            shadow.style.opacity = '0.6';
        }
        // 强制重绘一帧再加 vanish，确保 transition 生效
        void scene.offsetWidth;
        scene.classList.add('vanish');
        diceVanishTimer = setTimeout(() => {
            diceVanishTimer = 0;
            stage.classList.remove('show');
            scene.classList.remove('vanish');
            scene.style.transform = '';
            scene.style.opacity = '';
            showDiceResetMenu();
        }, DICE.VANISH_MS);
    }
    diceRafId = requestAnimationFrame(tick);
}

// 检查某张牌打出去后，是否会点炮给某个AI（用于给你手里的危险牌标红框）
function isDangerousTile(tile) {

}

function buildDeck() {
    deck = [];
    for (let s of suits) {
        for (let n = 1; n <= 9; n++) {
            for (let i = 0; i < 4; i++) deck.push(n + s);
        }
    }
    for (let n = 1; n <= honors.length; n++) {
        for (let i = 0; i < 4; i++) deck.push(n + '字');
    }
    shuffle(deck);
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function tileSuit(t){ return t.slice(-1); }
function tileRank(t){ return parseInt(t.slice(0, -1), 10); }

// Unicode 麻将牌字符（万/条/筒/字）
const wanGlyphs  = ['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏'];
const tiaoGlyphs = ['🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘'];
const tongGlyphs = ['🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡'];
const honorGlyphs = ['🀀','🀁','🀂','🀃','🀄','🀅','🀆']; // 东南西北中发白

function tileGlyph(t) {
    const suit = tileSuit(t);
    const rank = tileRank(t);
    if (suit === '万') return wanGlyphs[rank - 1];
    if (suit === '条') return tiaoGlyphs[rank - 1];
    if (suit === '筒') return tongGlyphs[rank - 1];
    if (suit === '字') return honorGlyphs[rank - 1];
    return t;
}

const rankChinese = ['一','二','三','四','五','六','七','八','九'];
function tileName(t) {
    if (tileSuit(t) === '字') return honors[tileRank(t) - 1];
    return rankChinese[tileRank(t) - 1] + tileSuit(t);
}

// ---------- 胡牌判断 ----------
// concealed: 手中暗牌数组；exposed: 已亮出的碰/吃/杠组合 [{type:'peng'|'chi'|'gang', tiles:[...]}]
// player: 可选，传入后会应用该玩家的“亮牌”加成（东南西北/中发白亮牌 -> 算幺九+刻子但不算开门）
// structuralOk: 能否拆成完整面子+对将（胡牌的基本前提）
// kaimen: 是否真正“开过门”——本局至少碰/吃过一次（不能纯暗手自摸算开门；亮牌不算开门）
// 特殊：中发白的对子做将，幺九+刻子自动满足（不影响开门，需另外满足）
/** 是否开过门：吃/碰/明杠（暗杠、亮风/亮箭不算） */
function isKaimen(exposed) {
    return (exposed || []).some(m =>
        m.type === 'peng' || m.type === 'chi' || (m.type === 'gang' && !m.concealed)
    );
}

/**
 * 胡牌结构分析（穷胡）：
 * structuralOk 能拆成面子+将；kaimen 开过门；sanmenqi 三门齐；
 * yaojiu 有幺九/字；kezi 有刻子（中发白做将或亮牌可补）。
 */
function analyzeHu(concealed, exposed = [], player = null) {
    const neededSets = 4 - exposed.length;
    const requiredLen = neededSets * 3 + 2;
    let structuralOk = false;
    let kezi = exposed.some(m => m.type === 'peng' || m.type === 'gang');
    let dragonPairAsJiang = false;
    if (concealed.length === requiredLen) {
        const sorted = [...concealed].sort(tileCompare);
        // 用计数表找对子，避免反复 filter
        const counts = {};
        for (const t of sorted) counts[t] = (counts[t] || 0) + 1;
        for (const pairTile of Object.keys(counts)) {
            if (counts[pairTile] < 2) continue;
            const rest = [];
            let skipped = 0;
            for (const t of sorted) {
                if (t === pairTile && skipped < 2) { skipped++; continue; }
                rest.push(t);
            }
            for (const decomp of decompose(rest)) {
                if (decomp.length !== neededSets) continue;
                structuralOk = true;
                if (decomp.some(m => m.type === 'triplet')) kezi = true;
                if (dragonTilesArr.includes(pairTile)) dragonPairAsJiang = true;
            }
        }
    }
    const allTiles = [...concealed, ...exposed.flatMap(m => m.tiles)];
    let yaojiu = allTiles.some(t => tileSuit(t) === '字' || tileRank(t) === 1 || tileRank(t) === 9);
    const numberSuitsUsed = new Set(allTiles.filter(t => tileSuit(t) !== '字').map(tileSuit));
    const sanmenqi = numberSuitsUsed.size === 3;
    const kaimen = isKaimen(exposed);

    if (dragonPairAsJiang) kezi = true;
    // 亮牌加成：只补幺九+刻子，不算开门
    if (player && windDragonBonus[player]) { yaojiu = true; kezi = true; }

    return { structuralOk, kaimen, sanmenqi, yaojiu, kezi };
}

function checkHu(concealed, exposed = [], player = null) {
    const a = analyzeHu(concealed, exposed, player);
    return a.structuralOk && a.kaimen && a.sanmenqi && a.yaojiu && a.kezi;
}

// 递归拆解为 刻子/顺子 组合，返回所有可能的组合方案
/** 将已去掉将牌的有序暗牌拆成刻子/顺子；tiles 须已按 tileCompare 排好 */
function decompose(tiles) {
    if (tiles.length === 0) return [[]];
    const results = [];
    const t = tiles[0];
    const suit = tileSuit(t);
    const rank = tileRank(t);

    // 尝试刻子
    const sameCount = tiles.filter(x => x === t).length;
    if (sameCount >= 3) {
        const rest = [...tiles];
        for (let i = 0, removed = 0; i < rest.length && removed < 3; i++) {
            if (rest[i] === t) { rest.splice(i, 1); i--; removed++; }
        }
        for (const sub of decompose(rest)) {
            results.push([{ type: 'triplet', tiles: [t, t, t] }, ...sub]);
        }
    }
    // 尝试顺子（同花色连续三张，字牌没有顺子）
    const t2 = (rank + 1) + suit;
    const t3 = (rank + 2) + suit;
    if (suit !== '字' && tiles.includes(t2) && tiles.includes(t3)) {
        const rest = [...tiles];
        rest.splice(rest.indexOf(t), 1);
        rest.splice(rest.indexOf(t2), 1);
        rest.splice(rest.indexOf(t3), 1);
        for (const sub of decompose(rest)) {
            results.push([{ type: 'sequence', tiles: [t, t2, t3] }, ...sub]);
        }
    }
    return results;
}

const DEAD_WALL = 16; // 荒牌墙：摸到只剩这些时流局
